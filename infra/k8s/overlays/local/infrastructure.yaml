apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      initContainers:
      - name: wait-for-redis-certs
        image: alpine:3.22.2
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        - |
          until [ -f /certs/ca/ca.crt ] && [ -f /certs/redis/redis.crt ] && [ -f /certs/redis/redis.key ] && [ -f /certs/clients/client.crt ] && [ -f /certs/clients/client.key ]; do
            echo waiting for local redis certificates
            sleep 2
          done
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      containers:
      - name: redis
        image: redis:8.4-alpine
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - 768mb
        - --maxmemory-policy
        - allkeys-lru
        - --port
        - "0"
        - --tls-port
        - "6379"
        - --tls-cert-file
        - /certs/redis/redis.crt
        - --tls-key-file
        - /certs/redis/redis.key
        - --tls-ca-cert-file
        - /certs/ca/ca.crt
        - --tls-auth-clients
        - "yes"
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        - name: certs
          mountPath: /certs
          readOnly: true
        readinessProbe:
          exec:
            command: ["sh", "-c", "redis-cli --tls --cert /certs/clients/client.crt --key /certs/clients/client.key --cacert /certs/ca/ca.crt -p 6379 ping | grep PONG"]
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "redis-cli --tls --cert /certs/clients/client.crt --key /certs/clients/client.key --cacert /certs/ca/ca.crt -p 6379 ping | grep PONG"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
      - name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
