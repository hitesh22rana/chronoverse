apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  labels:
    app.kubernetes.io/name: database-migration
    app.kubernetes.io/component: init-job
    chronoverse.io/certs: "true"
    chronoverse.io/datastore-client: "true"
    chronoverse.io/postgres-client: "true"
    chronoverse.io/clickhouse-client: "true"
    chronoverse.io/meilisearch-client: "true"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
        app.kubernetes.io/component: init-job
        chronoverse.io/datastore-client: "true"
        chronoverse.io/postgres-client: "true"
        chronoverse.io/clickhouse-client: "true"
        chronoverse.io/meilisearch-client: "true"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: database-migration
        image: ghcr.io/hitesh22rana/chronoverse/database-migration:latest
        imagePullPolicy: IfNotPresent
        # golang-migrate uses session-level PostgreSQL advisory locks, which
        # are incompatible with PgBouncer transaction pooling. Bootstrap
        # migrations therefore connect to the primary directly.
        env:
        - name: POSTGRES_HOST
          value: postgres-primary
        envFrom:
        - configMapRef:
            name: postgres-connection-config
        - secretRef:
            name: postgres-app-secret
        - configMapRef:
            name: clickhouse-connection-config
        - secretRef:
            name: clickhouse-secret
        - configMapRef:
            name: meilisearch-connection-config
        - secretRef:
            name: meilisearch-secret
        - configMapRef:
            name: observability-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      volumes:
      - name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-auth
          - secret:
              name: chronoverse-ca
          - secret:
              name: chronoverse-client-tls
