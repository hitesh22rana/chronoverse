apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-proxy-config
data:
  haproxy.cfg: |
    global
      log stdout format raw daemon
      maxconn 4000

    defaults
      mode http
      log global
      option httplog
      option dontlognull
      option http-server-close
      option redispatch
      retries 3
      timeout http-request 10s
      timeout queue 1m
      timeout connect 10s
      timeout client 10m
      timeout server 10m
      timeout http-keep-alive 10s
      timeout check 10s
      maxconn 3000

    backend dockerbackend
      server dockersocket /var/run/docker.sock

    frontend dockerfrontend
      bind :2375

      # Only trusted workers receive this generated token. Keeping it out of
      # the registered endpoint also prevents accidental disclosure in jobs.
      acl authorized req.hdr(X-Chronoverse-Docker-Proxy-Token) -m str "${DOCKER_PROXY_TOKEN}"
      http-request deny unless authorized

      # Exact method-and-path allowlist for Docker calls used by Chronoverse.
      # In particular, NETWORKS does not grant /networks/*/(dis)connect.
      acl read_method method GET HEAD
      acl post_method method POST
      acl delete_method method DELETE
      acl ping_or_version path,url_dec -m reg -i ^(/v[0-9.]+)?/((_ping)|(version))/?$
      acl image_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/images/.+/json/?$
      acl image_create path,url_dec -m reg -i ^(/v[0-9.]+)?/images/create/?$
      acl container_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json/?$
      acl container_logs path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/logs/?$
      acl container_create path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/create/?$
      acl container_action path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/((start)|(stop)|(wait))/?$
      acl container_delete path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/?$
      acl network_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/networks/[a-zA-Z0-9_.-]+/?$
      acl network_create path,url_dec -m reg -i ^(/v[0-9.]+)?/networks/create/?$

      http-request allow if read_method ping_or_version
      http-request allow if read_method image_inspect
      http-request allow if post_method image_create
      http-request allow if read_method container_inspect
      http-request allow if read_method container_logs
      http-request allow if post_method container_create
      http-request allow if post_method container_action
      http-request allow if delete_method container_delete
      http-request allow if read_method network_inspect
      http-request allow if post_method network_create
      http-request deny

      default_backend dockerbackend
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: docker-proxy
  labels:
    app.kubernetes.io/name: docker-proxy
    app.kubernetes.io/component: proxy
    chronoverse.io/client-certs: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-proxy
        app.kubernetes.io/component: proxy
    spec:
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: chronoverse.io/docker-workloads
                operator: In
                values: ["true"]
      containers:
      - name: docker-proxy
        image: tecnativa/docker-socket-proxy:v0.4.1
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
        - |
          test -n "${DOCKER_PROXY_TOKEN}"
          exec haproxy -W -db -f /etc/docker-proxy/haproxy.cfg
        ports:
        - name: docker
          containerPort: 2375
          hostPort: 2375
          protocol: TCP
        env:
        - name: DOCKER_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: docker-proxy-auth
              key: DOCKER_PROXY_TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        - name: docker-proxy-config
          mountPath: /etc/docker-proxy
          readOnly: true
      - name: runtime-agent
        image: ghcr.io/hitesh22rana/chronoverse/runtime-agent:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: postgres-connection-config
        - secretRef:
            name: postgres-secret
        - configMapRef:
            name: observability-config
        - configMapRef:
            name: runtime-agent-config
        env:
        - name: DOCKER_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: docker-proxy-auth
              key: DOCKER_PROXY_TOKEN
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: RUNTIME_AGENT_ID
          value: $(NODE_NAME)
        - name: RUNTIME_AGENT_NODE_NAME
          value: $(NODE_NAME)
        - name: DOCKER_HOST
          value: tcp://$(NODE_IP):2375
        - name: RUNTIME_AGENT_DOCKER_ENDPOINT
          value: tcp://$(NODE_IP):2375
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-proxy-config
        configMap:
          name: docker-proxy-config
      - name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
