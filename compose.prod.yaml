name: chronoverse

x-limits:
  # Database requires more cpu and memory
  database-limits: &database-limits
    deploy:
      resources:
        limits:
          cpus: "1" # 1 CPU
          memory: 1G # 1 GB
        reservations:
          cpus: "0.5" # 500 m CPU
          memory: 512M # 512 MB

  # Services require less cpu and memory
  services-limit: &services-limit
    deploy:
      resources:
        limits:
          cpus: "0.25" # 250 m CPU
          memory: 256M # 256 MB
        reservations:
          cpus: "0.1" # 100 m CPU
          memory: 128M # 128 MB

  # Lightweight workers process bounded database/Kafka batches.
  low-resources-workers-limit: &low-resources-workers-limit
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25" # 250 m CPU
          memory: 512M # 512 MB
        reservations:
          cpus: "0.1" # 100 m CPU
          memory: 256M # 256 MB

  # Mid resources workers handle Docker image coordination or larger log batches.
  mid-resources-workers-limit: &mid-resources-workers-limit
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5" # 500 m CPU
          memory: 2G # 2 GB
        reservations:
          cpus: "0.25" # 250 m CPU
          memory: 1G # 1 GB

  # High resources workers require a bit more cpu and memory
  high-resources-workers-limit: &high-resources-workers-limit
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2" # 2 CPU
          memory: 2G # 2 GB
        reservations:
          cpus: "1" # 1 CPU
          memory: 1G # 1 GB

services:
  postgres:
    <<: *database-limits
    image: postgres:18.0-alpine3.22
    container_name: postgres
    environment:
      POSTGRES_USER: primary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: chronoverse
    restart: on-failure
    volumes:
      - postgres:/var/lib/postgresql
      - ./certs/ca:/certs/ca:ro
      - ./certs/clients:/certs/clients:ro
      - ./certs/postgres:/certs/postgres:ro
      - ./certs/postgres/config:/etc/postgresql
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql 'host=0.0.0.0 user=primary dbname=postgres sslmode=verify-full sslrootcert=/certs/ca/ca.crt sslcert=/certs/clients/client.crt sslkey=/certs/clients/client.key' -c 'SELECT 1;'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      init-certs:
        condition: service_completed_successfully
    networks:
      - chronoverse

  clickhouse:
    <<: *database-limits
    image: clickhouse:25.8.7.3
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: chronoverse-client
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    restart: on-failure
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./certs/clickhouse:/etc/clickhouse-server/certs:ro
      - ./certs/ca:/etc/clickhouse-server/ca:ro
      - ./certs/clickhouse/config:/etc/clickhouse-server/conf.d:ro
      - ./certs/clickhouse/clients/config.xml:/etc/clickhouse-client/config.xml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --secure --host=localhost --port=9440 --user=chronoverse-client --password=\"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      init-certs:
        condition: service_completed_successfully
    networks:
      - chronoverse

  redis:
    <<: *database-limits
    image: redis:8.2.1-alpine
    container_name: redis
    restart: on-failure
    volumes:
      - redis:/data
      - ./certs/ca:/certs/ca:ro
      - ./certs/clients:/certs/clients:ro
      - ./certs/redis:/certs/redis:ro
    command:
      [
        "--port 0",
        "--tls-port 6379",
        "--tls-cert-file /certs/redis/redis.crt",
        "--tls-key-file /certs/redis/redis.key",
        "--tls-ca-cert-file /certs/ca/ca.crt",
        "--tls-auth-clients yes",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --tls --cert /certs/clients/client.crt --key /certs/clients/client.key --cacert /certs/ca/ca.crt -p 6379 ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      init-certs:
        condition: service_completed_successfully
    networks:
      - chronoverse

  meilisearch:
    image: getmeili/meilisearch:v1.45.2
    container_name: meilisearch
    restart: on-failure
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_SSL_AUTH_PATH: /certs/ca/ca.crt
      MEILI_SSL_REQUIRE_AUTH: true
      MEILI_SSL_CERT_PATH: /certs/meilisearch/meilisearch.crt
      MEILI_SSL_KEY_PATH: /certs/meilisearch/meilisearch.key
      MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE: true
      ENV: production
    volumes:
      - meilisearch:/meili_data
      - ./certs/ca:/certs/ca:ro
      - ./certs/clients:/certs/clients:ro
      - ./certs/meilisearch:/certs/meilisearch:ro
    depends_on:
      init-certs:
        condition: service_completed_successfully
    healthcheck:
      test: |
        sh -c '
          if [ -n "$$MEILI_SSL_AUTH_PATH" ] && [ -n "$$MEILI_SSL_CERT_PATH" ] && [ -n "$$MEILI_SSL_KEY_PATH" ]; then
            curl --cert /certs/clients/client.crt --key /certs/clients/client.key --cacert "$$MEILI_SSL_AUTH_PATH" -f https://meilisearch:7700/health
          else
            curl -f http://meilisearch:7700/health
          fi
        '
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chronoverse

  kafka:
    <<: *database-limits
    image: confluentinc/cp-kafka:7.6.7
    hostname: kafka
    container_name: kafka
    restart: on-failure
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: SSL://kafka:9094,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SSL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka:9094

      # SSL config...
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds.txt
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds.txt
      KAFKA_SSL_KEY_CREDENTIALS: key_creds.txt
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.2,TLSv1.3
      KAFKA_SSL_PROTOCOL: TLS

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Internal topics replication factors
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Ensure min ISR = 1 for single-broker
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Optional: global default
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # Other Confluent internal topics left at RF=1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_DURABILITY_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_TIER_METADATA_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: EDofQNqcSCa63isOyHHO9g
    volumes:
      - kafka:/var/lib/kafka/data
      - ./certs/kafka:/etc/kafka/secrets:ro
    depends_on:
      init-certs:
        condition: service_completed_successfully
    networks:
      - chronoverse

  init-kafka-topics:
    image: confluentinc/cp-kafka:7.6.7
    container_name: init-kafka-topics
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9094
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_WORKFLOWS_TOPIC_PARTITIONS: ${KAFKA_WORKFLOWS_TOPIC_PARTITIONS:-2}
      KAFKA_JOBS_TOPIC_PARTITIONS: ${KAFKA_JOBS_TOPIC_PARTITIONS:-4}
      KAFKA_JOB_LOGS_TOPIC_PARTITIONS: ${KAFKA_JOB_LOGS_TOPIC_PARTITIONS:-4}
      KAFKA_ANALYTICS_TOPIC_PARTITIONS: ${KAFKA_ANALYTICS_TOPIC_PARTITIONS:-2}
    volumes:
      - ./certs/kafka:/etc/kafka/secrets:ro
    tmpfs:
      - /var/lib/kafka/data
    entrypoint:
      - bash
      - -ec
      - |
        bootstrap_server="$${KAFKA_BOOTSTRAP_SERVER:-kafka:9094}"
        replication_factor="$${KAFKA_TOPIC_REPLICATION_FACTOR:-1}"
        client_config="/tmp/kafka-client.properties"

        cat > "$$client_config" <<'PROPERTIES'
        security.protocol=SSL
        ssl.truststore.location=/etc/kafka/secrets/kafka.truststore.jks
        ssl.truststore.password=chronoverse
        ssl.keystore.location=/etc/kafka/secrets/kafka.keystore.jks
        ssl.keystore.password=chronoverse
        ssl.key.password=chronoverse
        PROPERTIES

        kafka_topics() {
          kafka-topics --bootstrap-server "$$bootstrap_server" --command-config "$$client_config" "$$@"
        }

        require_positive_int() {
          name="$$1"
          value="$$2"

          if ! [[ "$$value" =~ ^[0-9]+$$ ]] || (( value < 1 )); then
            echo "$$name must be a positive integer, got: $$value" >&2
            exit 1
          fi
        }

        topic_partitions() {
          topic="$$1"
          description="$$(kafka_topics --describe --topic "$$topic" 2>/dev/null || true)"
          if [[ -z "$$description" ]]; then
            return 1
          fi

          while IFS= read -r line; do
            if [[ "$$line" == *"PartitionCount:"* ]]; then
              remainder="$${line#*PartitionCount: }"
              printf '%s\n' "$${remainder%%[[:space:]]*}"
              return 0
            fi
          done <<< "$$description"

          return 1
        }

        create_or_update_topic() {
          topic="$$1"
          desired_partitions="$$2"

          require_positive_int "partition count for $$topic" "$$desired_partitions"

          if current_partitions="$$(topic_partitions "$$topic")"; then
            if (( current_partitions < desired_partitions )); then
              echo "Increasing topic $$topic partitions from $$current_partitions to $$desired_partitions"
              kafka_topics --alter --topic "$$topic" --partitions "$$desired_partitions"
            elif (( current_partitions > desired_partitions )); then
              echo "Topic $$topic already has $$current_partitions partitions; Kafka cannot reduce it to $$desired_partitions"
            else
              echo "Topic $$topic already exists with $$current_partitions partitions"
            fi
            return
          fi

          echo "Creating topic $$topic with $$desired_partitions partitions"
          kafka_topics --create --if-not-exists \
            --topic "$$topic" \
            --partitions "$$desired_partitions" \
            --replication-factor "$$replication_factor"
        }

        require_positive_int "KAFKA_TOPIC_REPLICATION_FACTOR" "$$replication_factor"

        echo "Waiting for Kafka at $$bootstrap_server"
        until kafka_topics --list >/dev/null 2>&1; do
          sleep 2
        done

        create_or_update_topic "workflows" "$${KAFKA_WORKFLOWS_TOPIC_PARTITIONS:-2}"
        create_or_update_topic "jobs" "$${KAFKA_JOBS_TOPIC_PARTITIONS:-4}"
        create_or_update_topic "job_logs" "$${KAFKA_JOB_LOGS_TOPIC_PARTITIONS:-4}"
        create_or_update_topic "analytics" "$${KAFKA_ANALYTICS_TOPIC_PARTITIONS:-2}"

        echo "Kafka topics are ready"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - chronoverse

  lgtm:
    image: grafana/otel-lgtm:0.11.10
    container_name: lgtm
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
    restart: on-failure
    volumes:
      - lgtm:/data
    networks:
      - chronoverse

  docker-proxy:
    <<: *services-limit
    image: haproxy:3.4-alpine
    container_name: docker-proxy
    user: root
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-proxy-certs/server:/certs/docker-proxy:ro
      - ./compose/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - chronoverse
    command: ["sh", "-ec", "export DOCKER_PROXY_TOKEN=$(cat /certs/docker-proxy/token 2>/dev/null || echo ''); exec haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg"]
    depends_on:
      init-certs:
        condition: service_completed_successfully

  runtime-agent:
    <<: *services-limit
    image: ghcr.io/hitesh22rana/chronoverse/runtime-agent:latest
    container_name: runtime-agent
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: primary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: chronoverse
      POSTGRES_TLS_ENABLED: true
      POSTGRES_TLS_CA_FILE: certs/ca/ca.crt
      POSTGRES_TLS_CERT_FILE: certs/clients/client.crt
      POSTGRES_TLS_KEY_FILE: certs/clients/client.key
      POSTGRES_MIN_CONNS: 1
      DOCKER_HOST: tcp://docker-proxy:2376
      RUNTIME_AGENT_ID: local-docker
      RUNTIME_AGENT_NODE_NAME: compose-local
      RUNTIME_AGENT_DOCKER_ENDPOINT: tcp://docker-proxy:2376
      RUNTIME_AGENT_DOCKER_HEALTH_ENDPOINT: tcp://docker-proxy:2376
      RUNTIME_AGENT_HEARTBEAT_INTERVAL: 5s
      RUNTIME_AGENT_MAX_CONCURRENCY: ${RUNTIME_AGENT_MAX_CONCURRENCY:-4}
      DOCKER_PROXY_TLS_CA_FILE: /docker-proxy-certs/ca.crt
      DOCKER_PROXY_TLS_CERT_FILE: /docker-proxy-certs/client.crt
      DOCKER_PROXY_TLS_KEY_FILE: /docker-proxy-certs/client.key
      DOCKER_PROXY_TLS_SERVER_NAME: docker-proxy
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ENV: production
    entrypoint: |
      sh -c '
      while [ ! -f /certs/issuers/trusted.json ] || [ ! -f /docker-proxy-certs/ca.crt ]; do
        echo "Waiting for certificates..."
        sleep 1
      done
      export DOCKER_PROXY_TOKEN=$(cat /docker-proxy-certs/token 2>/dev/null || echo "")
      exec /bin/service
      '
    restart: on-failure
    volumes:
      - ./certs/ca:/certs/ca:ro
      - ./certs/clients:/certs/clients:ro
      - ./certs/issuers/trusted.json:/certs/issuers/trusted.json:ro
      - ./certs/issuers/runtime-agent/auth.ed:/certs/issuers/runtime-agent/auth.ed:ro
      - ./certs/issuers/server/auth.ed.pub:/certs/issuers/server/auth.ed.pub:ro
      - ./certs/issuers/users-service/auth.ed.pub:/certs/issuers/users-service/auth.ed.pub:ro
      - ./certs/issuers/workflows-service/auth.ed.pub:/certs/issuers/workflows-service/auth.ed.pub:ro
      - ./certs/issuers/jobs-service/auth.ed.pub:/certs/issuers/jobs-service/auth.ed.pub:ro
      - ./certs/issuers/notifications-service/auth.ed.pub:/certs/issuers/notifications-service/auth.ed.pub:ro
      - ./certs/issuers/analytics-service/auth.ed.pub:/certs/issuers/analytics-service/auth.ed.pub:ro
      - ./certs/issuers/scheduling-worker/auth.ed.pub:/certs/issuers/scheduling-worker/auth.ed.pub:ro
      - ./certs/issuers/workflow-worker/auth.ed.pub:/certs/issuers/workflow-worker/auth.ed.pub:ro
      - ./certs/issuers/execution-worker/auth.ed.pub:/certs/issuers/execution-worker/auth.ed.pub:ro
      - ./certs/issuers/runtime-agent/auth.ed.pub:/certs/issuers/runtime-agent/auth.ed.pub:ro
      - ./certs/issuers/joblogs-processor/auth.ed.pub:/certs/issuers/joblogs-processor/auth.ed.pub:ro
      - ./certs/issuers/analytics-processor/auth.ed.pub:/certs/issuers/analytics-processor/auth.ed.pub:ro
      - ./certs/issuers/outbox-relay/auth.ed.pub:/certs/issuers/outbox-relay/auth.ed.pub:ro
      - ./docker-proxy-certs/runtime-agent:/docker-proxy-certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      lgtm:
        condition: service_started
      init-certs:
        condition: service_completed_successfully
      init-database-migration:
        condition: service_completed_successfully
    networks:
      - chronoverse

  init-certs:
    image: alpine:3.22.2
    container_name: init-certs
    volumes:
      - ./certs:/certs:rw
      - ./docker-proxy-certs:/docker-proxy-certs:rw
      - ./scripts/compose/init-docker-proxy-certs.sh:/usr/local/bin/init-docker-proxy-certs:ro
    entrypoint: |
      sh -c '
        AUTH_ISSUERS="server users-service workflows-service jobs-service notifications-service analytics-service scheduling-worker workflow-worker execution-worker runtime-agent joblogs-processor analytics-processor outbox-relay"
        echo "🔐 Generating per-issuer Ed25519 keys..."
        apk add --no-cache openssl >/dev/null 2>&1 || (apk update && apk add --no-cache openssl)
        mkdir -p /certs/issuers
        for iss in $$AUTH_ISSUERS; do
          mkdir -p /certs/issuers/$$iss
          if [ ! -f /certs/issuers/$$iss/auth.ed ] || [ ! -f /certs/issuers/$$iss/auth.ed.pub ]; then
            echo "🔑 Generating key for $$iss..."
            openssl genpkey -algorithm ED25519 -outform pem -out /certs/issuers/$$iss/auth.ed
            openssl pkey -in /certs/issuers/$$iss/auth.ed -pubout -out /certs/issuers/$$iss/auth.ed.pub
          fi
          chmod 440 /certs/issuers/$$iss/auth.ed
          chown 100:101 /certs/issuers/$$iss/auth.ed 2>/dev/null || chgrp 101 /certs/issuers/$$iss/auth.ed 2>/dev/null || true
          chmod 444 /certs/issuers/$$iss/auth.ed.pub
        done
        TRUSTED=/certs/issuers/trusted.json
        if [ ! -f "$$TRUSTED" ]; then
          echo "🔐 Generating trusted bundle..."
          printf "{\n" > "$$TRUSTED.tmp"
          first=1
          for iss in $$AUTH_ISSUERS; do
            kid="$$iss:$$(date +%Y%m%d)-$$(openssl rand -hex 4)"
            if [ $$first -eq 0 ]; then printf ",\n" >> "$$TRUSTED.tmp"; fi
            first=0
            printf "  \"%s\": {\"iss\": \"%s\", \"pub\": \"%s/auth.ed.pub\"}" "$$kid" "$$iss" "$$iss" >> "$$TRUSTED.tmp"
          done
          printf "\n}\n" >> "$$TRUSTED.tmp"
          mv "$$TRUSTED.tmp" "$$TRUSTED"
          chmod 444 "$$TRUSTED"
          echo "✅ Trusted bundle generated"
        else
          echo "✅ Trusted bundle already exists"
        fi
        echo "✅ Per-issuer keys ready"

        echo "🔐 Initializing TLS certificates for services..."

        apk update && apk add --no-cache openssl openjdk11-jre-headless
        export JAVA_HOME=/usr/lib/jvm/java-11-openjdk

        mkdir -p /certs/ca
        # Generate CA if not exists
        if [ ! -f /certs/ca/ca.key ]; then
          echo "🛡️ Generating CA certificate..."
          openssl genrsa -out /certs/ca/ca.key 4096
          openssl req -x509 -new -nodes -key /certs/ca/ca.key -sha256 \
            -days 365 -out /certs/ca/ca.crt \
            -subj "/CN=chronoverse-ca"
          echo "✅ CA certificate created"
        fi

        SERVICES="postgres redis clickhouse kafka meilisearch users-service workflows-service jobs-service notifications-service analytics-service"
        for svc in $$SERVICES; do
          mkdir -p /certs/$$svc

          if [ ! -f /certs/$$svc/$$svc.key ]; then
            CERT_PATH="/certs/$$svc"
            echo "🔧 Generating certificate for $$svc..."
            openssl genrsa -out "$$CERT_PATH/$$svc.key" 4096
            openssl req -new -key "$$CERT_PATH/$$svc.key" \
              -out "$$CERT_PATH/$$svc.csr" \
              -subj "/CN=chronoverse-$$svc"

            echo "subjectAltName=IP:0.0.0.0,IP:127.0.0.1,DNS:$$svc" > "$$CERT_PATH/$$svc-ext.cnf"

            openssl x509 -req -in "$$CERT_PATH/$$svc.csr" \
              -CA /certs/ca/ca.crt -CAkey /certs/ca/ca.key \
              -CAcreateserial -out "$$CERT_PATH/$$svc.crt" -days 365 \
              -extfile "$$CERT_PATH/$$svc-ext.cnf"

            rm "$$CERT_PATH/$$svc.csr" "$$CERT_PATH/$$svc-ext.cnf"

            echo "✅ Certificate created for $$svc"
          fi
        done

        # Convert Kafka PEM to PKCS12
        echo "🔄 Converting Kafka PEM to PKCS12..."
        openssl pkcs12 -export \
          -in /certs/kafka/kafka.crt \
          -inkey /certs/kafka/kafka.key \
          -certfile /certs/ca/ca.crt \
          -out /certs/kafka/kafka.p12 \
          -name kafka \
          -password pass:chronoverse

        # Import PKCS12 to JKS keystore
        echo "🔄 Importing PKCS12 to JKS keystore..."
        keytool -importkeystore \
          -deststorepass chronoverse \
          -destkeypass chronoverse \
          -destkeystore /certs/kafka/kafka.keystore.jks \
          -srckeystore /certs/kafka/kafka.p12 \
          -srcstoretype PKCS12 \
          -srcstorepass chronoverse \
          -alias kafka

        # Create Kafka truststore
        echo "🔄 Creating Kafka truststore..."
        keytool -import -trustcacerts -alias CARoot \
          -file /certs/ca/ca.crt \
          -keystore /certs/kafka/kafka.truststore.jks \
          -storepass chronoverse -noprompt

        # Client certificate for mTLS
        echo "🔐 Generating client certificate for mTLS..."
        mkdir -p /certs/clients
        if [ ! -f /certs/clients/client.key ]; then
          openssl genrsa -out /certs/clients/client.key 4096
          openssl req -new -key /certs/clients/client.key \
            -out /certs/clients/client.csr \
            -subj "/CN=chronoverse-client"

          echo "subjectAltName=DNS:client" > /certs/clients/client-ext.cnf

          openssl x509 -req -in /certs/clients/client.csr \
            -CA /certs/ca/ca.crt -CAkey /certs/ca/ca.key \
            -CAcreateserial -out /certs/clients/client.crt -days 365 \
            -extfile /certs/clients/client-ext.cnf

          rm /certs/clients/client.csr /certs/clients/client-ext.cnf
          rm /certs/ca/ca.srl
          echo "✅ Client certificate created"
        fi

        DOCKER_PROXY_ROTATE_CERTS="$${DOCKER_PROXY_ROTATE_CERTS:-false}" \
          /usr/local/bin/init-docker-proxy-certs /docker-proxy-certs /certs/docker-proxy

        echo "🔐 Setting permissions for all certificates..."

        chmod 444 /certs/ca/ca.crt
        chmod 444 /certs/ca/ca.key

        chmod 444 /certs/kafka/kafka.crt /certs/kafka/kafka.key /certs/kafka/kafka.keystore.jks /certs/kafka/kafka.truststore.jks

        echo "🔐 Creating Kafka keystore credentials files..."
        echo "chronoverse" > /certs/kafka/keystore_creds.txt
        echo "chronoverse" > /certs/kafka/truststore_creds.txt
        echo "chronoverse" > /certs/kafka/key_creds.txt
        chmod 444 /certs/kafka/*_creds.txt

        for svc in $$SERVICES; do
          chmod 444 /certs/$$svc/$$svc.crt
          chmod 444 /certs/$$svc/$$svc.key
        done

        chmod 600 /certs/postgres/postgres.key
        chmod 600 /certs/clients/client.key

        chmod 444 /certs/clients/client.crt

        # ClickHouse server files: make readable by clickhouse user (UID/GID 101).
        chown 101:101 /certs/clickhouse/clickhouse.key /certs/clickhouse/clickhouse.crt
        chmod 640 /certs/clickhouse/clickhouse.key
        chmod 444 /certs/clickhouse/clickhouse.crt

        # Create ClickHouse-specific copies of client certs for mTLS inside the ClickHouse container.
        mkdir -p /certs/clickhouse/clients
        cp -f /certs/clients/client.key /certs/clickhouse/clients/client.key
        cp -f /certs/clients/client.crt /certs/clickhouse/clients/client.crt
        chown 101:101 /certs/clickhouse/clients/client.key /certs/clickhouse/clients/client.crt
        chmod 640 /certs/clickhouse/clients/client.key
        chmod 444 /certs/clickhouse/clients/client.crt

        echo "✅ Permissions set successfully"

        mkdir -p /certs/postgres/config
        POSTGRES_CONF=/certs/postgres/config/postgresql.conf
        POSTGRES_HBA_CONF=/certs/postgres/config/pg_hba.conf

        if [ ! -f "$$POSTGRES_CONF" ]; then
          echo "📝 Creating postgresql.conf..."

          echo "listen_addresses='\''*'\''" > "$$POSTGRES_CONF"
          echo "ssl=on" >> "$$POSTGRES_CONF"
          echo "ssl_cert_file='\''/certs/postgres/postgres.crt'\''" >> "$$POSTGRES_CONF"
          echo "ssl_key_file='\''/certs/postgres/postgres.key'\''" >> "$$POSTGRES_CONF"
          echo "ssl_ca_file='\''/certs/ca/ca.crt'\''" >> "$$POSTGRES_CONF"
          echo "ssl_max_protocol_version='\''TLSv1.3'\''" >> "$$POSTGRES_CONF"
          echo "password_encryption='\''scram-sha-256'\''" >> "$$POSTGRES_CONF"
        fi

        if [ ! -f "$$POSTGRES_HBA_CONF" ]; then
          echo "📝 Creating pg_hba.conf..."

          echo "# TYPE  DATABASE        USER            ADDRESS                 METHOD" > "$$POSTGRES_HBA_CONF"
          echo "hostssl all             all             0.0.0.0/0               scram-sha-256 clientcert=verify-full" >> "$$POSTGRES_HBA_CONF"
        fi

        mkdir -p /certs/clickhouse/config
        CLICKHOUSE_TLS_CONF=/certs/clickhouse/config/tls.xml
        CLICKHOUSE_USERS_CONF=/certs/clickhouse/config/users.xml
        CLICKHOUSE_CLIENT_CONF=/certs/clickhouse/clients/config.xml

        cat > "$$CLICKHOUSE_TLS_CONF" << 'EOF'
      <?xml version="1.0"?>
      <clickhouse>
        <tcp_port>0</tcp_port>
        <tcp_port_secure>9440</tcp_port_secure>
        <openSSL>
          <server>
            <certificateFile>/etc/clickhouse-server/certs/clickhouse.crt</certificateFile>
            <privateKeyFile>/etc/clickhouse-server/certs/clickhouse.key</privateKeyFile>
            <caConfig>/etc/clickhouse-server/ca/ca.crt</caConfig>
            <verificationMode>strict</verificationMode>
            <minVersion>TLSv1_2</minVersion>
            <maxVersion>TLSv1_3</maxVersion>
          </server>
          <client>
            <loadDefaultCAFile>false</loadDefaultCAFile>
            <certificateFile>/etc/clickhouse-server/certs/clients/client.crt</certificateFile>
            <privateKeyFile>/etc/clickhouse-server/certs/clients/client.key</privateKeyFile>
            <caConfig>/etc/clickhouse-server/ca/ca.crt</caConfig>
            <verificationMode>strict</verificationMode>
            <minVersion>TLSv1_2</minVersion>
          </client>
        </openSSL>
      </clickhouse>
      EOF

        cat > "$$CLICKHOUSE_USERS_CONF" << 'EOF'
      <?xml version="1.0"?>
      <clickhouse>
        <users>
          <chronoverse-client>
            <password from_env="CLICKHOUSE_PASSWORD"/>
            <networks>
              <ip>::/0</ip>
              <ip>0.0.0.0/0</ip>
            </networks>
            <profile>default</profile>
            <quota>default</quota>
          </chronoverse-client>
        </users>
      </clickhouse>
      EOF

        cat > "$$CLICKHOUSE_CLIENT_CONF" << 'EOF'
      <?xml version="1.0"?>
      <config>
        <secure>true</secure>
        <openSSL>
          <client>
            <certificateFile>/etc/clickhouse-server/certs/clients/client.crt</certificateFile>
            <privateKeyFile>/etc/clickhouse-server/certs/clients/client.key</privateKeyFile>
            <caConfig>/etc/clickhouse-server/ca/ca.crt</caConfig>
            <verificationMode>strict</verificationMode>
            <minVersion>TLSv1_2</minVersion>
          </client>
        </openSSL>
      </config>
      EOF

        echo "🎉 TLS certificates initialized successfully!"
      '
    restart: "no"
    networks:
      - chronoverse

