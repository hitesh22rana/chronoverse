apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-proxy-config
data:
  IMAGES: "1"
  IMAGE_CREATE: "1"
  CONTAINERS: "1"
  CONTAINER_CREATE: "1"
  CONTAINER_START: "1"
  CONTAINER_LOGS: "1"
  CONTAINER_ATTACH: "1"
  CONTAINER_WAIT: "1"
  CONTAINER_DELETE: "1"
  CONTAINER_STOP: "1"
  POST: "1"
  AUTH: "1"
  NETWORKS: "0"
  VOLUMES: "0"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: docker-proxy
  labels:
    app.kubernetes.io/name: docker-proxy
    app.kubernetes.io/component: proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-proxy
        app.kubernetes.io/component: proxy
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: chronoverse.io/docker-workloads
                operator: In
                values: ["true"]
      containers:
      - name: docker-proxy
        image: tecnativa/docker-socket-proxy:v0.4.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: docker
          containerPort: 2375
        envFrom:
        - configMapRef:
            name: docker-proxy-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: docker-proxy
  labels:
    app.kubernetes.io/name: docker-proxy
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: docker-proxy
  ports:
  - name: docker
    port: 2375
    targetPort: docker
