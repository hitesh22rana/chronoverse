- target:
    kind: Job
    name: database-migration
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /certs/issuers/trusted.json ] && [ -f /certs/ca/ca.crt ] && [ -f /certs/clients/client.crt ]; do echo waiting for local certificates; sleep 2; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
      - name: wait-for-datastores
        # Use the postgres image so we get pg_isready/psql out of the box
        # and can wait for both the TCP port and the chronoverse_app role
        # (the latter is created by init-postgres-app-role, which runs in
        # parallel and is required for the migration connection to succeed).
        image: postgres:18.0-alpine3.22
        command:
        - sh
        - -ec
        - |
          set -eu
          first_clickhouse="${CLICKHOUSE_HOSTS%%,*}"
          clickhouse_host="${first_clickhouse%%:*}"
          clickhouse_port="${first_clickhouse##*:}"
          if [ "$clickhouse_port" = "$first_clickhouse" ]; then clickhouse_port=9440; fi
          export PGSSLMODE=verify-full
          export PGSSLROOTCERT=/certs/ca/ca.crt PGSSLCERT=/certs/clients/client.crt PGSSLKEY=/certs/clients/client.key
          until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres at $POSTGRES_HOST:$POSTGRES_PORT"; sleep 2; done
          # The migration connects as POSTGRES_USER (chronoverse_app), which
          # is provisioned by init-postgres-app-role. Wait until the role
          # exists; psql exits non-zero on a missing role.
          until PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1" >/dev/null 2>&1; do
            echo "waiting for postgres role $POSTGRES_USER"
            sleep 2
          done
          until nc -z "$clickhouse_host" "$clickhouse_port"; do echo "waiting for clickhouse at $clickhouse_host:$clickhouse_port"; sleep 2; done
        env:
        # Migrations must run on the primary directly. golang-migrate's
        # pg_advisory_lock/pg_advisory_unlock rely on a single session, and
        # pgbouncer's transaction pool reassigns backend connections between
        # statements, which would strand the lock and block subsequent runs.
        - name: POSTGRES_HOST
          value: postgres-primary
        - name: POSTGRES_PORT
          value: "5432"
        envFrom:
        - configMapRef:
            name: clickhouse-connection-config
        - secretRef:
            name: postgres-app-secret
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
- target:
    kind: Job
    name: init-kafka-topics
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-kafka-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /etc/kafka/secrets/kafka.keystore.jks ] && [ -f /etc/kafka/secrets/kafka.truststore.jks ] && [ -f /etc/kafka/secrets/keystore_creds.txt ] && [ -f /etc/kafka/secrets/truststore_creds.txt ] && [ -f /etc/kafka/secrets/key_creds.txt ]; do echo waiting for kafka certificates; sleep 2; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: kafka-client-secrets
          mountPath: /etc/kafka/secrets
          subPath: kafka
          readOnly: true
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: kafka-client-secrets
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: kafka-client-secrets
        persistentVolumeClaim:
          claimName: certs-pvc
    - op: test
