global
  log stdout format raw daemon
  maxconn 4000

defaults
  mode http
  log global
  option httplog
  option dontlognull
  option http-server-close
  option redispatch
  retries 3
  timeout http-request 10s
  timeout queue 1m
  timeout connect 10s
  timeout client 10m
  timeout server 10m
  timeout http-keep-alive 10s
  timeout check 10s
  maxconn 3000

backend dockerbackend
  server dockersocket /var/run/docker.sock

frontend dockerfrontend
  bind :2376 ssl crt /certs/docker-proxy/server.pem ca-file /certs/docker-proxy/ca.crt verify required

  acl authorized req.hdr(X-Chronoverse-Docker-Proxy-Token) -m str "${DOCKER_PROXY_TOKEN}"
  http-request deny unless authorized

  # Authentication proves that a certificate chains to the dedicated proxy CA;
  # these exact role identities provide authorization and deny generic clients.
  acl known_client ssl_c_s_dn(CN) -m str docker-proxy-client-runtime-agent docker-proxy-client-workflow-worker docker-proxy-client-execution-worker
  acl image_client ssl_c_s_dn(CN) -m str docker-proxy-client-workflow-worker docker-proxy-client-execution-worker
  acl cleanup_client ssl_c_s_dn(CN) -m str docker-proxy-client-workflow-worker docker-proxy-client-execution-worker
  acl execution_client ssl_c_s_dn(CN) -m str docker-proxy-client-execution-worker
  http-request deny unless known_client

  acl read_method method GET HEAD
  acl post_method method POST
  acl delete_method method DELETE
  acl ping_or_version path,url_dec -m reg -i ^(/v[0-9.]+)?/((_ping)|(version))/?$
  acl image_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/images/.+/json/?$
  acl image_create path,url_dec -m reg -i ^(/v[0-9.]+)?/images/create/?$
  acl container_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json/?$
  acl container_logs path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/logs/?$
  acl container_create path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/create/?$
  acl container_start path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/start/?$
  acl container_stop path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/stop/?$
  acl container_wait path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/wait/?$
  acl container_delete path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/?$
  acl network_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/networks/[a-zA-Z0-9_.-]+/?$
  acl network_create path,url_dec -m reg -i ^(/v[0-9.]+)?/networks/create/?$

  http-request allow if known_client read_method ping_or_version
  http-request allow if image_client read_method image_inspect
  http-request allow if image_client post_method image_create
  http-request allow if execution_client read_method container_inspect
  http-request allow if cleanup_client read_method container_logs
  http-request allow if execution_client post_method container_create
  http-request allow if execution_client post_method container_start
  http-request allow if cleanup_client post_method container_stop
  http-request allow if execution_client post_method container_wait
  http-request allow if cleanup_client delete_method container_delete
  http-request allow if execution_client read_method network_inspect
  http-request allow if execution_client post_method network_create
  http-request deny

  default_backend dockerbackend
