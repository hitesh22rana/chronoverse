name: Deploy Static webs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Refresh system certificate trust
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          . /etc/os-release
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "20260816ubuntu0.${VERSION_ID}.1"

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
          cache: 'npm'
          cache-dependency-path: './static/package-lock.json'
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install dependencies
        working-directory: ./static
        run: npm ci
      - name: Build
        working-directory: ./static
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./static/out

  deploy:
    environment:
      name: chronoverse
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
