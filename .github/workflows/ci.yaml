name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  lint:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Run linters
        run: make lint

  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Build code
        run: make build/all

  proto-generated:
    name: Check Generated Protobuf Stubs
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Verify generated protobuf stubs are committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- pkg/proto buf.lock)" ]; then
            echo "Generated protobuf stubs are out of date."
            echo "Run 'make generate' and commit the resulting pkg/proto and buf.lock changes."
            git status --short -- pkg/proto buf.lock
            git diff -- pkg/proto buf.lock
            exit 1
          fi

  test:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      # Run every unit suite with the race detector. Docker-backed integration
      # tests skip under -short and are covered by the dedicated `integration`
      # job below, so this gate stays fast and Docker-independent.
      - name: Run tests
        run: make test/short

      - name: Check if PR can be merged
        if: github.event_name == 'pull_request'
        run: |
          if [ $? -ne 0 ]; then
            echo "Tests failed, PR cannot be merged!"
            exit 1
          fi

  integration:
    name: Integration tests (Docker)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Pull container images for integration tests
        run: |
          docker pull postgres:18.0-alpine3.22
          docker pull clickhouse/clickhouse-server:25.8.7.3
          docker pull redis:8.2.1-alpine
          docker pull getmeili/meilisearch:v1.45.2
          docker pull confluentinc/cp-kafka:7.6.7

      - name: Run integration tests
        run: make test/integration

  dashboard:
    name: Dashboard checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  static-site:
    name: Static site checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  release-users-service:
    name: Release Users Service
    needs: [lint, build, proto-generated, test, integration]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push users-service Docker image
        run: |
          IMAGE="users-service"
          VERSION_TAG="${{ steps.version.outputs.TAG_NAME }}"
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME_SUFFIX="chronoverse/${IMAGE}"
          IMAGE_FULL_NAME_WITH_TAG="ghcr.io/${OWNER_LOWERCASE}/${IMAGE_NAME_SUFFIX}:${VERSION_TAG}"
          CACHE_SCOPE="buildx-${IMAGE}"

          echo "Checking if image ${IMAGE_FULL_NAME_WITH_TAG} already exists..."
          if docker manifest inspect "${IMAGE_FULL_NAME_WITH_TAG}" > /dev/null 2>&1; then
            echo "Image ${IMAGE_FULL_NAME_WITH_TAG} already exists. Skipping build and push."
          else
            echo "Image ${IMAGE_FULL_NAME_WITH_TAG} does not exist. Building and pushing..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg NAME=${IMAGE} \
              --build-arg VERSION=${VERSION_TAG} \
              --build-arg PRIVATE_KEY_PATH=certs/auth.ed \
              --build-arg PUBLIC_KEY_PATH=certs/auth.ed.pub \
              -t "${IMAGE_FULL_NAME_WITH_TAG}" \
              -t "ghcr.io/${OWNER_LOWERCASE}/${IMAGE_NAME_SUFFIX}:latest" \
              --push \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              .
          fi

