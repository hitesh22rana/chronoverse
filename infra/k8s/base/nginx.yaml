apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      # Rate limits key on $remote_addr; recover the real client address
      # before evaluating them.
      include /etc/nginx/realip/realip.conf;

      # Rate limiting zones
      limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
      limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
      # Connection zones are separate so each route family enforces its own
      # per-client cap instead of sharing one counter across locations.
      limit_conn_zone $binary_remote_addr zone=auth_conn_zone:10m;
      limit_conn_zone $binary_remote_addr zone=api_conn_zone:10m;
      limit_conn_zone $binary_remote_addr zone=events_conn_zone:10m;
      limit_req_status 429;
      limit_conn_status 429;

      server {
        listen 80;

        # Request hygiene
        client_max_body_size 4m;
        client_body_timeout 15s;
        client_header_timeout 10s;

        # Auth endpoints are aggressively throttled to brake brute-force and
        # credential-stuffing attempts.
        location = /api/auth/login {
          limit_req zone=auth_zone burst=5 nodelay;
          limit_conn auth_conn_zone 20;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/auth/register {
          limit_req zone=auth_zone burst=5 nodelay;
          limit_conn auth_conn_zone 20;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Immutable content-hashed build assets are exempt from request-rate
        # limits so a cold page load cannot exhaust the API burst budget.
        location /_next/static/ {
          limit_conn api_conn_zone 50;

          proxy_pass http://dashboard:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          limit_req zone=api_zone burst=40 nodelay;
          limit_conn api_conn_zone 50;

          proxy_pass http://dashboard:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
          limit_req zone=api_zone burst=40 nodelay;
          limit_conn api_conn_zone 50;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ ^/api/workflows/.*/jobs/.*/events$ {
          limit_conn events_conn_zone 5;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-realip-config
data:
  realip.conf: |
    # Rate limits key on $remote_addr, which behind ingress-nginx is the
    # controller address rather than the client's; without this every
    # client would share one rate limit bucket. Recover the client IP
    # from X-Forwarded-For, trusting only addresses the controller
    # actually connects from.
    #
    # DEPLOYMENT-CRITICAL: set the CIDR below to your cluster's
    # ingress-nginx source range (its pod or node CIDR). Too narrow:
    # every client still shares one bucket. Too broad: callers can forge
    # X-Forwarded-For to obtain unlimited fresh buckets.
    set_real_ip_from 10.244.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/component: ingress
    spec:
      containers:
      - name: nginx
        image: nginx:alpine3.22
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-realip-config
          mountPath: /etc/nginx/realip
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-realip-config
        configMap:
          name: nginx-realip-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: ingress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx
  ports:
  - name: http
    port: 80
    targetPort: http

