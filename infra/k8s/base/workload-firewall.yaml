# Host firewall for workload bridges: plain Docker containers aren't pods, so
# NetworkPolicies can't select them — this enforces in the host netns instead.
# Rules: compose/firewall/workload-firewall.sh, baked into the image
# (Dockerfile.firewall). WORKLOAD_SUBNET must match the worker env.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: workload-firewall
  labels:
    app.kubernetes.io/name: workload-firewall
    app.kubernetes.io/component: firewall
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-firewall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-firewall
    spec:
      # Same nodes as docker-proxy: every daemon hosting workloads needs the rules.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: chronoverse.io/docker-workloads
                operator: In
                values: ["true"]
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: workload-firewall
        image: ghcr.io/hitesh22rana/chronoverse/firewall:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKLOAD_SUBNET
          value: 198.18.247.0/24
        # Extra non-RFC1918 cluster ranges (e.g. pod/service CIDRs).
        - name: CLUSTER_CIDRS
          value: ""
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # Both jumps must exist: DOCKER-USER (forwarded) and INPUT (host-bound).
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - iptables -C DOCKER-USER -j CHRONOVERSE-WORKLOAD && iptables -C INPUT -j CHRONOVERSE-WORKLOAD-IN
          periodSeconds: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - iptables -C DOCKER-USER -j CHRONOVERSE-WORKLOAD && iptables -C INPUT -j CHRONOVERSE-WORKLOAD-IN
          periodSeconds: 60
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN"]
