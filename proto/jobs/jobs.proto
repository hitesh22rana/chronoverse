syntax = "proto3";

package jobs;

option go_package = "github.com/hitesh22rana/chronoverse/pkg/proto/go/jobs;jobs";

// ScheduleJobRequest contains the details needed to create a new job.
message ScheduleJobRequest {
  string workflow_id         = 1; // ID of the workflow
  string user_id             = 2; // ID of the user
  string scheduled_at        = 3; // Time the job is scheduled to run
  string trigger             = 4; // Trigger type of the job (AUTOMATIC or MANUAL)
  string idempotency_key     = 5; // Required idempotency key for scheduling
  int64  workflow_generation = 6; // Optional workflow generation guard for automatic scheduling
}

// ScheduleJobResponse contains the result of a job creation attempt.
message ScheduleJobResponse {
  string id = 1; // ID of the job
}

// CancelJobRequest contains a deterministic workflow-driven cancellation command.
message CancelJobRequest {
  string id                   = 1;
  string command_id           = 2;
  string terminal_reason_code = 3;
}

// CancelJobResponse is the persisted pre-cancellation cleanup snapshot.
message CancelJobResponse {
  string id               = 1;
  string previous_status  = 2;
  string container_id     = 3;
  string runtime_node_id  = 4;
  string runtime_endpoint = 5;
  int32  attempt          = 6;
  string runtime_instance = 7;
  string intent_id        = 8;
}

// ClaimJobRequest contains the details needed to claim a queued job for execution.
message ClaimJobRequest {
  string id                     = 1; // ID of the job
  string workflow_id            = 2; // ID of the workflow
  string worker_id              = 3; // ID of the execution worker
  int32  lease_duration_seconds = 4; // Lease duration in seconds
  int32  dispatch_attempt       = 5; // Dispatch attempt from the Kafka event
  string command_id             = 6; // Deterministic process-local claim command
  string process_instance_id    = 7; // Exact executor process identity
}

// ClaimJobResponse contains the result of a job claim attempt.
message ClaimJobResponse {
  bool   claimed           = 1; // Whether the job was claimed
  string reason            = 2; // Reason when the job was not claimed
  string id                = 3; // ID of the job
  string workflow_id       = 4; // ID of the workflow
  string user_id           = 5; // ID of the user
  string trigger           = 6; // Trigger type of the job
  string scheduled_at      = 7; // Time the job was scheduled to run
  int32  dispatch_attempts = 8; // Number of dispatch attempts
  int32  attempts          = 9; // Number of execution attempts
  string lease_token       = 10; // Lease token required for updates
  string runtime_node_id   = 11; // Runtime node selected for Docker-backed execution
  string runtime_endpoint  = 12; // Docker endpoint selected for Docker-backed execution
  string lease_expires_at  = 13; // Authoritative committed lease expiry
}

// GetReadyRuntimeNodeRequest contains the details needed to select a runtime node.
message GetReadyRuntimeNodeRequest {}

// GetReadyRuntimeNodeResponse contains a fresh READY runtime node.
message GetReadyRuntimeNodeResponse {
  string runtime_node_id  = 1; // Runtime node selected for Docker data plane work
  string runtime_endpoint = 2; // Docker endpoint selected for Docker data plane work
}

// ListReadyRuntimeNodesRequest contains the details needed to list runtime nodes.
message ListReadyRuntimeNodesRequest {}

// ListReadyRuntimeNodesResponse contains every fresh READY runtime node.
message ListReadyRuntimeNodesResponse {
  repeated GetReadyRuntimeNodeResponse nodes = 1; // All fresh READY runtime nodes
}

// RenewJobLeaseRequest contains the details needed to renew a running job lease.
message RenewJobLeaseRequest {
  string id                     = 1; // ID of the job
  string lease_token            = 2; // Current lease token
  int32  lease_duration_seconds = 3; // Lease duration in seconds
}

// RenewJobLeaseResponse contains the result of a lease renewal.
message RenewJobLeaseResponse {
  string lease_expires_at = 1; // Authoritative committed lease expiry
}

// AttachJobContainerRequest contains the details needed to attach a container ID to a running job.
message AttachJobContainerRequest {
  string id              = 1; // ID of the job
  string lease_token     = 2; // Current lease token
  string container_id    = 3; // Container ID
  string runtime_node_id = 4; // Runtime node that owns the container
  string command_id      = 5; // Logical attach command
}

// AttachJobContainerResponse contains the result of attaching a container ID.
message AttachJobContainerResponse {}

// CompleteJobRequest contains the details needed to complete a claimed job.
message CompleteJobRequest {
  string id          = 1; // ID of the job
  string lease_token = 2; // Current lease token
  string command_id  = 3; // Logical completion command
}

// CompleteJobResponse contains the result of completing a job.
message CompleteJobResponse {}

// FailJobRequest contains the details needed to fail a claimed job.
message FailJobRequest {
  string id                   = 1; // ID of the job
  string lease_token          = 2; // Current lease token
  string failure_kind         = 3; // USER or SYSTEM
  string error_code           = 4; // Error code
  string error_message        = 5; // Error message
  string terminal_reason_code = 6; // Normalized failure reason
  string command_id           = 7; // Logical failure command
}

// FailJobResponse contains the result of failing a job.
message FailJobResponse {}

// CancelClaimedJobRequest contains the details needed to cancel a claimed job.
message CancelClaimedJobRequest {
  string id                   = 1; // ID of the job
  string lease_token          = 2; // Current lease token
  string terminal_reason_code = 3; // Normalized cancellation reason
  string command_id           = 4; // Logical cancellation command
}

// CancelClaimedJobResponse contains the result of canceling a claimed job.
message CancelClaimedJobResponse {}

// ReleaseJobForRetryRequest contains the details needed to release a claimed job for retry.
message ReleaseJobForRetryRequest {
  string id              = 1; // ID of the job
  string lease_token     = 2; // Current lease token
  string next_attempt_at = 3; // Time the job should be retried
  string error_code      = 4; // Error code
  string error_message   = 5; // Error message
  string command_id      = 6; // Logical release command
}

// ReleaseJobForRetryResponse contains the result of releasing a job for retry.
message ReleaseJobForRetryResponse {}

// ExpiredJobLease contains a running job whose lease has expired.
message ExpiredJobLease {
  string id                  = 1; // ID of the job
  string workflow_id         = 2; // ID of the workflow
  string user_id             = 3; // ID of the user
  string container_id        = 4; // Container ID, if available
  string lease_token         = 5; // Expired lease token
  string leased_by           = 6; // Worker that held the lease
  string trigger             = 7; // Trigger type of the job
  string scheduled_at        = 8; // Time the job was scheduled to run
  int32  attempts            = 9; // Number of execution attempts
  bool   log_retention       = 10; // Whether logs should be durably retained
  string runtime_node_id     = 11; // Runtime node that owns the container
  string runtime_endpoint    = 12; // Docker endpoint for the owning runtime node
  bool   runtime_unavailable = 13; // Whether the owning runtime is considered unavailable
}

// RecoverExpiredJobLeasesRequest contains the details needed to fetch expired leases.
message RecoverExpiredJobLeasesRequest {
  int32  batch_size             = 1; // Maximum number of expired leases to claim
  string worker_id              = 2; // Worker claiming the expired leases for recovery
  int32  lease_duration_seconds = 3; // Lease duration in seconds for recovered claims
  string command_id             = 4; // Logical recovery-wave command
  string process_instance_id    = 5; // Recovering executor process
}

// RecoverExpiredJobLeasesResponse contains expired leases to recover.
message RecoverExpiredJobLeasesResponse {
  repeated ExpiredJobLease jobs = 1; // Expired leased jobs
}

// GetJobRequest contains the details needed to get a job.
message GetJobRequest {
  string id          = 1; // ID of the job
  string workflow_id = 2; // ID of the workflow
  string user_id     = 3; // ID of the user
}

// GetJobResponse contains the result of a job retrieval attempt.
message GetJobResponse {
  string id                    = 1; // ID of the job
  string workflow_id           = 2; // ID of the workflow
  string status                = 3; // Status of the job
  string trigger               = 4; // Trigger type of the job (AUTOMATIC or MANUAL)
  string scheduled_at          = 5; // Time the job is scheduled to run
  string started_at            = 6; // Time the job was started
  string completed_at          = 7; // Time the job was completed
  string created_at            = 8; // Time the job was created
  string updated_at            = 9; // Time the job was last updated
  string status_reason_code    = 10; // Safe terminal reason code (FAILED/CANCELED only)
  string status_reason_message = 11; // Safe terminal reason message (FAILED/CANCELED only)
}

// GetJobByIDRequest contains the details needed to get a job by ID.
message GetJobByIDRequest {
  string id = 1; // ID of the job
}

// GetJobByIDResponse contains the result of a job retrieval attempt.
message GetJobByIDResponse {
  string id           = 1; // ID of the job
  string workflow_id  = 2; // ID of the workflow
  string user_id      = 3; // ID of the user
  string container_id = 4; // ID of the container (if applicable)
  string status       = 5; // Status of the job
  string trigger      = 6; // Trigger type of the job (AUTOMATIC or MANUAL)
  string scheduled_at = 7; // Time the job is scheduled to run
  string started_at   = 8; // Time the job was started
  string completed_at = 9; // Time the job was completed
  string created_at   = 10; // Time the job was created
  string updated_at   = 11; // Time the job was last updated
}

// LogStream represents the type of log stream.
enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT      = 1;
  LOG_STREAM_STDERR      = 2;
  LOG_STREAM_ALL         = 3;
}

// LogSortOrder represents the order used for retained log pagination.
enum LogSortOrder {
  LOG_SORT_ORDER_UNSPECIFIED = 0;
  LOG_SORT_ORDER_DESC        = 1;
  LOG_SORT_ORDER_ASC         = 2;
}

// SearchJobLogsFilters are the filters that are to be applied on the get job logs request.
message GetJobLogsFilters {
  LogStream stream = 1;
}

// GetJobLogsRequest contains the details needed to get the logs of a job.
message GetJobLogsRequest {
  string            id          = 1; // ID of the job
  string            workflow_id = 2; // ID of the workflow
  string            user_id     = 3; // ID of the user
  string            cursor      = 4; // Cursor for pagination
  GetJobLogsFilters filters     = 5; // Filters applied to the search
  LogSortOrder      sort_order  = 6; // Sort order for retained log pagination
}

// Log contains the details of a log.
message Log {
  string timestamp    = 1; // Time the log was created
  string message      = 2; // Log message
  uint32 sequence_num = 3; // Sequence number of the log
  string stream       = 4; // Stream type (stdout or stderr)
  string event_id     = 5; // Unique retained/live log event ID
}

// GetJobLogsResponse contains the result of a job log retrieval attempt.
message GetJobLogsResponse {
  string       id              = 1; // ID of the job
  string       workflow_id     = 2; // ID of the workflow
  repeated Log logs            = 3; // List of log messages
  string       cursor          = 4; // Cursor for pagination
  string       highlight_token = 5; // Token used for parsing highlighted log ranges
}

// StreamJobLogsRequest contains the details needed to stream the logs of a job.
message StreamJobLogsRequest {
  string id          = 1; // ID of the job
  string workflow_id = 2; // ID of the workflow
  string user_id     = 3; // ID of the user
}

// SearchJobLogsFilters are the filters that are to be applied on the search job logs request.
message SearchJobLogsFilters {
  LogStream stream  = 1;
  string    message = 2;
}

// SearchJobLogsRequest contains the details needed to search the logs of a job.
message SearchJobLogsRequest {
  string               id                = 1; // ID of the job
  string               workflow_id       = 2; // ID of the workflow
  string               user_id           = 3; // ID of the user
  string               cursor            = 4; // Cursor for pagination
  SearchJobLogsFilters filters           = 5; // Filters applied to the search
  LogSortOrder         sort_order        = 6; // Sort order for retained log pagination
  bool                 disable_highlight = 7; // Disable search result highlighting
}

// ListJobsFilters contains the filters for listing jobs.
message ListJobsFilters {
  string status  = 1; // Status of the job (optional)
  string trigger = 2; // Trigger type of the job (optional)
}

// ListJobsRequest contains the details needed to list all jobs for a workflow_id.
message ListJobsRequest {
  string                   workflow_id = 1; // ID of the workflow
  string                   user_id     = 2; // ID of the user
  string                   cursor      = 3; // Cursor for pagination
  optional ListJobsFilters filters     = 4; // Filters applied to the list
}

// JobsResponse contains the result of a job listing attempt.
message JobsResponse {
  string id                    = 1; // ID of the job
  string workflow_id           = 2; // ID of the workflow
  string container_id          = 3; // ID of the container (if applicable)
  string status                = 4; // Status of the job
  string trigger               = 5; // Trigger type of the job (AUTOMATIC or MANUAL)
  string scheduled_at          = 6; // Time the job is scheduled to run
  string started_at            = 7; // Time the job was started
  string completed_at          = 8; // Time the job was completed
  string created_at            = 9; // Time the job was created
  string updated_at            = 10; // Time the job was last updated
  int32  attempts              = 11; // Number of execution attempts
  string runtime_node_id       = 12; // Runtime node that owns the container
  string runtime_endpoint      = 13; // Docker endpoint snapshot for the owning runtime node
  string status_reason_code    = 14; // Safe terminal reason code (FAILED/CANCELED only)
  string status_reason_message = 15; // Safe terminal reason message (FAILED/CANCELED only)
  string runtime_instance      = 16;
  string intent_id             = 17;
}

message ListJobsResponse {
  repeated JobsResponse jobs   = 1; // List of jobs
  string                cursor = 2; // Cursor for pagination
}

// JobsService handles job related operations.
// ContainerCleanupReceiptRequest identifies one immutable job container.
message ContainerCleanupReceiptRequest {
  string job_id           = 1;
  string container_id     = 2;
  string runtime_instance = 3;
  string intent_id        = 4;
}

message GetContainerCleanupReceiptResponse {
  bool completed = 1;
}

message RecordContainerCleanupReceiptResponse {}

// Cleanup generations are independent of workflow generations.
// Every operation requires immutable job/container/runtime-instance/intent identity.
// Redrive additionally requires a repair reason; its audit actor is the validated
// admin JWT subject, never a caller-supplied field.
message ContainerCleanupAttemptRequest {
  string job_id           = 1;
  string container_id     = 2;
  int64  generation       = 3; // Expected cleanup generation, not the workflow generation.
  string token            = 4; // Failure reports only: the token granted by Begin.
  string error_code       = 5; // Failure reports only: non-OK gRPC status name.
  bool   interrupted      = 6; // Caller cancellation returns the attempt without spending its budget.
  string runtime_instance = 7;
  string intent_id        = 8;
  string reason           = 9; // Redrive only: required operator repair reason (maximum 2048 bytes).
}

message ContainerCleanupAttemptResponse {
  string state      = 1;
  int64  generation = 2;
  int32  attempts   = 3;
  string token      = 4;
}

// Container intents are immutable per execution attempt and survive source deletion.
message ContainerIntentCommand {
  string job_id              = 1;
  string lease_token         = 2;
  string intent_id           = 3;
  string runtime_instance    = 4;
  string request_hash        = 5;
  string container_id        = 6;
  string outcome             = 7;
  string error_code          = 8;
  string error_message       = 9;
  string token               = 10;
  string reason              = 11;
  int32  attempt             = 12;
  int32  batch_size          = 13;
  int64  generation          = 14;
  string stage               = 15;
  int64  workflow_generation = 16;
}

message ContainerIntent {
  string id                       = 1;
  string job_id                   = 2;
  string workflow_id              = 3;
  string user_id                  = 4;
  string name                     = 5;
  string runtime_node_id          = 6;
  string runtime_endpoint         = 7;
  string runtime_instance         = 8;
  string request_hash             = 9;
  string container_id             = 10;
  string outcome                  = 11;
  string error_code               = 12;
  string error_message            = 13;
  string token                    = 14;
  string next_inspection_at       = 15;
  string last_inspection_at       = 16;
  int32  attempt                  = 17;
  int64  generation               = 18;
  bool   create_reserved          = 19;
  bool   start_reserved           = 20;
  bool   closed                   = 21;
  bool   log_retention            = 22;
  bool   quarantined              = 23;
  int32  inspection_errors        = 24;
  bool   held_capacity            = 25;
  string stage                    = 26;
  string inspection_error_code    = 27;
  string inspection_error_message = 28;
  int64  workflow_generation      = 29;
  string image_reference          = 30;
}

message ContainerIntentResponse {
  ContainerIntent intent  = 1;
  bool            granted = 2;
}

message ListContainerIntentsResponse {
  repeated ContainerIntent intents = 1;
}

// JobsService handles jobs related operations.
service JobsService {
  // Internal lifecycle authority; mutation grants are single-use, never replayed.
  rpc EnsureContainerIntent(ContainerIntentCommand) returns (ContainerIntentResponse) {}
  rpc GetContainerIntent(ContainerIntentCommand) returns (ContainerIntentResponse) {}
  rpc ReserveContainerCreate(ContainerIntentCommand) returns (ContainerIntentResponse) {}
  rpc ObserveContainer(ContainerIntentCommand) returns (ContainerIntentResponse) {}
  rpc ReserveContainerStart(ContainerIntentCommand) returns (ContainerIntentResponse) {}
  rpc CloseContainerIntent(ContainerIntentCommand) returns (ContainerIntentResponse) {}
  rpc ClaimContainerIntents(ContainerIntentCommand) returns (ListContainerIntentsResponse) {}
  rpc ReportContainerInspection(ContainerIntentCommand) returns (ContainerIntentResponse) {}
  rpc ListContainerIntents(ContainerIntentCommand) returns (ListContainerIntentsResponse) {}
  rpc RedriveContainerIntent(ContainerIntentCommand) returns (ContainerIntentResponse) {}

  // Internal-only cleanup execution authority and administrative redrive.
  rpc BeginContainerCleanupAttempt(ContainerCleanupAttemptRequest) returns (ContainerCleanupAttemptResponse) {}
  rpc FailContainerCleanupAttempt(ContainerCleanupAttemptRequest) returns (ContainerCleanupAttemptResponse) {}
  rpc RedriveContainerCleanup(ContainerCleanupAttemptRequest) returns (ContainerCleanupAttemptResponse) {}
  // Internal-only receipts survive job deletion and outbox pruning.
  rpc GetContainerCleanupReceipt(ContainerCleanupReceiptRequest) returns (GetContainerCleanupReceiptResponse) {}
  rpc RecordContainerCleanupReceipt(ContainerCleanupReceiptRequest) returns (RecordContainerCleanupReceiptResponse) {}

  // ScheduleJob schedules a job to run at a specific time.
  rpc ScheduleJob(ScheduleJobRequest) returns (ScheduleJobResponse) {}

  // CancelJob applies a deterministic workflow-driven cancellation.
  // This is an internal API and should not be exposed to the public.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {}

  // ClaimJob atomically claims a queued job for execution.
  // This is an internal API and should not be exposed to the public.
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse) {}

  // GetReadyRuntimeNode returns a fresh READY runtime node for Docker data plane work.
  // This is an internal API and should not be exposed to the public.
  rpc GetReadyRuntimeNode(GetReadyRuntimeNodeRequest) returns (GetReadyRuntimeNodeResponse) {}

  // ListReadyRuntimeNodes returns every fresh READY runtime node for Docker data plane work.
  // This is an internal API and should not be exposed to the public.
  rpc ListReadyRuntimeNodes(ListReadyRuntimeNodesRequest) returns (ListReadyRuntimeNodesResponse) {}

  // RenewJobLease renews a running job lease.
  // This is an internal API and should not be exposed to the public.
  rpc RenewJobLease(RenewJobLeaseRequest) returns (RenewJobLeaseResponse) {}

  // AttachJobContainer attaches a container ID to a running claimed job.
  // This is an internal API and should not be exposed to the public.
  rpc AttachJobContainer(AttachJobContainerRequest) returns (AttachJobContainerResponse) {}

  // CompleteJob completes a running claimed job.
  // This is an internal API and should not be exposed to the public.
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse) {}

  // FailJob marks a running claimed job as failed.
  // This is an internal API and should not be exposed to the public.
  rpc FailJob(FailJobRequest) returns (FailJobResponse) {}

  // CancelClaimedJob marks a running claimed job as canceled.
  // This is an internal API and should not be exposed to the public.
  rpc CancelClaimedJob(CancelClaimedJobRequest) returns (CancelClaimedJobResponse) {}

  // ReleaseJobForRetry releases a running claimed job back to pending.
  // This is an internal API and should not be exposed to the public.
  rpc ReleaseJobForRetry(ReleaseJobForRetryRequest) returns (ReleaseJobForRetryResponse) {}

  // RecoverExpiredJobLeases returns expired running job leases for recovery.
  // This is an internal API and should not be exposed to the public.
  rpc RecoverExpiredJobLeases(RecoverExpiredJobLeasesRequest) returns (RecoverExpiredJobLeasesResponse) {}

  // GetJob gets a job by ID and user_id.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {}

  // GetJobByID gets a job by ID.
  // This is an internal API and should not be exposed to the public.
  rpc GetJobByID(GetJobByIDRequest) returns (GetJobByIDResponse) {}

  // GetJobLogs gets the logs of a job.
  rpc GetJobLogs(GetJobLogsRequest) returns (GetJobLogsResponse) {}

  // StreamJobLogs streams the logs of a job.
  rpc StreamJobLogs(StreamJobLogsRequest) returns (stream Log) {}

  // SearchJobLogs returns the filtered logs of a job.
  rpc SearchJobLogs(SearchJobLogsRequest) returns (GetJobLogsResponse) {}

  // ListJobs returns a list of all jobs for a workflow_id owned by a user.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {}
}
