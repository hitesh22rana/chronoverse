apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-proxy-config
data:
  IMAGES: "1"
  IMAGE_CREATE: "1"
  CONTAINERS: "1"
  CONTAINER_CREATE: "1"
  CONTAINER_START: "1"
  CONTAINER_LOGS: "1"
  CONTAINER_ATTACH: "1"
  CONTAINER_WAIT: "1"
  CONTAINER_DELETE: "1"
  CONTAINER_STOP: "1"
  POST: "1"
  AUTH: "1"
  NETWORKS: "0"
  VOLUMES: "0"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: docker-proxy
  labels:
    app.kubernetes.io/name: docker-proxy
    app.kubernetes.io/component: proxy
    chronoverse.io/client-certs: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-proxy
        app.kubernetes.io/component: proxy
    spec:
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: chronoverse.io/docker-workloads
                operator: In
                values: ["true"]
      containers:
      - name: docker-proxy
        image: tecnativa/docker-socket-proxy:v0.4.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: docker
          containerPort: 2375
          hostPort: 2375
          protocol: TCP
        envFrom:
        - configMapRef:
            name: docker-proxy-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
      - name: runtime-agent
        image: ghcr.io/hitesh22rana/chronoverse/runtime-agent:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: postgres-connection-config
        - secretRef:
            name: postgres-secret
        - configMapRef:
            name: observability-config
        - configMapRef:
            name: runtime-agent-config
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: RUNTIME_AGENT_ID
          value: $(NODE_NAME)
        - name: RUNTIME_AGENT_NODE_NAME
          value: $(NODE_NAME)
        - name: DOCKER_HOST
          value: tcp://$(NODE_IP):2375
        - name: RUNTIME_AGENT_DOCKER_ENDPOINT
          value: tcp://$(NODE_IP):2375
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
---
apiVersion: v1
kind: Service
metadata:
  name: docker-proxy
  labels:
    app.kubernetes.io/name: docker-proxy
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: docker-proxy
  ports:
  - name: docker
    port: 2375
    targetPort: docker
