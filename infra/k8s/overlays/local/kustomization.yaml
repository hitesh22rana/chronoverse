apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chronoverse

resources:
- ../../base
- storage.yaml
- infrastructure.yaml
- cert-bootstrap.yaml
- bootstrap-rbac.yaml

replicas:
- name: pgbouncer
  count: 1
- name: analytics-processor
  count: 1
- name: analytics-service
  count: 1
- name: dashboard
  count: 1
- name: execution-worker
  count: 1
- name: joblogs-processor
  count: 1
- name: jobs-service
  count: 1
- name: nginx
  count: 1
- name: notifications-service
  count: 1
- name: outbox-relay
  count: 1
- name: scheduling-worker
  count: 1
- name: server
  count: 1
- name: users-service
  count: 1
- name: workflow-worker
  count: 1
- name: workflows-service
  count: 1

configMapGenerator:
- name: postgres-connection-config
  behavior: merge
  literals:
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_TLS_ENABLED=true
- name: redis-connection-config
  behavior: merge
  literals:
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - REDIS_TLS_ENABLED=true
- name: clickhouse-connection-config
  behavior: merge
  literals:
  - CLICKHOUSE_HOSTS=clickhouse:9440
  - CLICKHOUSE_USERNAME=chronoverse-client
  - CLICKHOUSE_TLS_ENABLED=true
- name: meilisearch-connection-config
  behavior: merge
  literals:
  - MEILISEARCH_URI=https://meilisearch:7700
  - MEILISEARCH_TLS_ENABLED=true
- name: kafka-connection-config
  behavior: merge
  literals:
  - KAFKA_BROKERS=kafka:9094
- name: server-config
  behavior: merge
  literals:
  - SERVER_HOST_URL=http://localhost
  - SERVER_FRONTEND_URL=http://localhost
  - SERVER_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,

patches:
- path: nginx-realip.yaml
- target:
    kind: Deployment
    name: pgbouncer
  patch: |-
    # volumes/2 in the base pgbouncer Deployment is the certs volume; assert
    # the name so a base reorder fails loudly instead of silently rewriting
    # the wrong slot.
    - op: test
      path: /spec/template/spec/volumes/2/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/2
      value:
        name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
- target:
    kind: Job
    name: init-postgres-app-role
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /certs/ca/ca.crt ] && [ -f /certs/clients/client.crt ] && [ -f /certs/clients/client.key ] && [ -f /certs/postgres/postgres.crt ] && [ -f /certs/postgres/postgres.key ]; do echo waiting for local postgres certificates; sleep 2; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
- target:
    kind: DaemonSet
    labelSelector: chronoverse.io/client-certs=true
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /certs/ca/ca.crt ] && [ -f /certs/clients/client.crt ] && [ -f /certs/clients/client.key ]; do echo waiting for local certificates; sleep 2; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
    # certs sits at index 4 in the base DaemonSet (after docker-socket,
    # docker-proxy-config, and the two isolated Docker proxy identities); keep
    # this patch aligned with the base volume order. The test op guards
    # against silent reordering.
    - op: test
      path: /spec/template/spec/volumes/4/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/4
      value:
        name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
