# Host firewall for the workload bridge on Docker-workload nodes. Workload
# containers are plain Docker containers (not pods), so Kubernetes
# NetworkPolicies cannot select them — enforcement runs in the host network
# namespace via this DaemonSet instead. Rules live in
# compose/firewall/workload-firewall.sh, baked into the firewall image
# (Dockerfile.firewall); internet egress stays open, host/private/metadata/
# cluster destinations are dropped. WORKLOAD_SUBNET must match
# EXECUTION_WORKER_WORKLOAD_SUBNET (code default 198.18.247.0/24).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: workload-firewall
  labels:
    app.kubernetes.io/name: workload-firewall
    app.kubernetes.io/component: firewall
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-firewall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-firewall
    spec:
      # Same nodes as the docker-proxy DaemonSet: every Docker daemon that can
      # host workload containers needs the host rules.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: chronoverse.io/docker-workloads
                operator: In
                values: ["true"]
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: workload-firewall
        image: ghcr.io/hitesh22rana/chronoverse/firewall:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WORKLOAD_SUBNET
          value: 198.18.247.0/24
        # Non-RFC1918 cluster ranges (set pod/service CIDRs here if outside RFC 1918).
        - name: CLUSTER_CIDRS
          value: ""
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # The jumps must exist in both chains: DOCKER-USER covers forwarded
        # traffic, INPUT covers connections terminating on the host itself.
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - iptables -C DOCKER-USER -j CHRONOVERSE-WORKLOAD && iptables -C INPUT -j CHRONOVERSE-WORKLOAD-IN
          periodSeconds: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - iptables -C DOCKER-USER -j CHRONOVERSE-WORKLOAD && iptables -C INPUT -j CHRONOVERSE-WORKLOAD-IN
          periodSeconds: 60
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN"]
