apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronoverse-bootstrap
  labels:
    app.kubernetes.io/component: bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chronoverse-bootstrap
  labels:
    app.kubernetes.io/component: bootstrap
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - chronoverse-ca
  - chronoverse-client-tls
  # Kubernetes cannot restrict create by resourceNames. setup.sh creates
  # placeholders, so the in-cluster bootstrap only needs narrowly scoped
  # patch access to synchronize the generated local CA and client identity.
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chronoverse-bootstrap
  labels:
    app.kubernetes.io/component: bootstrap
subjects:
- kind: ServiceAccount
  name: chronoverse-bootstrap
  namespace: chronoverse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chronoverse-bootstrap
