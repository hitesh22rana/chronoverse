apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: gateway
    chronoverse.io/certs: "true"
    chronoverse.io/datastore-client: "true"
    chronoverse.io/redis-client: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/component: gateway
        chronoverse.io/redis-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: ghcr.io/hitesh22rana/chronoverse/server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: redis-connection-config
        - configMapRef:
            name: observability-config
        - configMapRef:
            name: server-config
        - secretRef:
            name: chronoverse-server-security
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          failureThreshold: 6
          initialDelaySeconds: 20
      volumes:
      - name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-auth
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
          - secret:
              name: chronoverse-service-tls
