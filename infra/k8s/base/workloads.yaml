apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  labels:
    app.kubernetes.io/name: users-service
    app.kubernetes.io/component: backend
    chronoverse.io/certs: "true"
    chronoverse.io/datastore-client: "true"
    chronoverse.io/postgres-client: "true"
    chronoverse.io/redis-client: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: users-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: users-service
        app.kubernetes.io/component: backend
        chronoverse.io/postgres-client: "true"
        chronoverse.io/redis-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: users-service
        image: ghcr.io/hitesh22rana/chronoverse/users-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 50051
        envFrom:
        - configMapRef:
            name: postgres-connection-config
        - secretRef:
            name: postgres-app-secret
        - configMapRef:
            name: redis-connection-config
        - configMapRef:
            name: observability-config
        - configMapRef:
            name: users-service-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        livenessProbe:
          exec:
            command: ["/bin/grpc-health-probe", "-addr=localhost:50051", "-tls", "-tls-ca-cert=certs/ca/ca.crt", "-tls-client-cert=certs/users-service/users-service.crt", "-tls-client-key=certs/users-service/users-service.key", "-tls-server-name=users-service"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
          initialDelaySeconds: 30
        readinessProbe:
          exec:
            command: ["/bin/grpc-health-probe", "-addr=localhost:50051", "-tls", "-tls-ca-cert=certs/ca/ca.crt", "-tls-client-cert=certs/users-service/users-service.crt", "-tls-client-key=certs/users-service/users-service.key", "-tls-server-name=users-service"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-auth
              items:
              - key: trusted.json
                path: issuers/trusted.json
              - key: server-auth.ed
                path: issuers/server/auth.ed
              - key: server-auth.ed.pub
                path: issuers/server/auth.ed.pub
              - key: users-service-auth.ed
                path: issuers/users-service/auth.ed
              - key: users-service-auth.ed.pub
                path: issuers/users-service/auth.ed.pub
              - key: workflows-service-auth.ed
                path: issuers/workflows-service/auth.ed
              - key: workflows-service-auth.ed.pub
                path: issuers/workflows-service/auth.ed.pub
              - key: jobs-service-auth.ed
                path: issuers/jobs-service/auth.ed
              - key: jobs-service-auth.ed.pub
                path: issuers/jobs-service/auth.ed.pub
              - key: notifications-service-auth.ed
                path: issuers/notifications-service/auth.ed
              - key: notifications-service-auth.ed.pub
                path: issuers/notifications-service/auth.ed.pub
              - key: analytics-service-auth.ed
                path: issuers/analytics-service/auth.ed
              - key: analytics-service-auth.ed.pub
                path: issuers/analytics-service/auth.ed.pub
              - key: scheduling-worker-auth.ed
                path: issuers/scheduling-worker/auth.ed
              - key: scheduling-worker-auth.ed.pub
                path: issuers/scheduling-worker/auth.ed.pub
              - key: workflow-worker-auth.ed
                path: issuers/workflow-worker/auth.ed
              - key: workflow-worker-auth.ed.pub
                path: issuers/workflow-worker/auth.ed.pub
