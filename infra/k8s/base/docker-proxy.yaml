apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-proxy-config
data:
  haproxy.cfg: |
    global
      log stdout format raw daemon
      maxconn 4000

    defaults
      mode http
      log global
      option httplog
      option dontlognull
      option http-server-close
      option redispatch
      retries 3
      timeout http-request 10s
      timeout queue 1m
      timeout connect 10s
      timeout client 10m
      timeout server 10m
      timeout http-keep-alive 10s
      timeout check 10s
      maxconn 3000

    backend dockerbackend
      server dockersocket /var/run/docker.sock

    frontend dockerfrontend
      bind :2376 ssl crt /certs/docker-proxy/server.pem ca-file /certs/docker-proxy/ca.crt verify required

      # Only trusted workers receive this generated token. Keeping it out of
      # the registered endpoint also prevents accidental disclosure in jobs.
      # mTLS is the primary authentication; the token remains as a second factor.
      acl authorized req.hdr(X-Chronoverse-Docker-Proxy-Token) -m str "${DOCKER_PROXY_TOKEN}"
      http-request deny unless authorized

      # mTLS authenticates the dedicated issuer; exact certificate identities
      # authorize the minimum Docker API surface needed by each service role.
      acl known_client ssl_c_s_dn(CN) -m str docker-proxy-client-runtime-agent docker-proxy-client-workflow-worker docker-proxy-client-execution-worker
      acl image_client ssl_c_s_dn(CN) -m str docker-proxy-client-workflow-worker docker-proxy-client-execution-worker
      acl cleanup_client ssl_c_s_dn(CN) -m str docker-proxy-client-workflow-worker docker-proxy-client-execution-worker
      acl execution_client ssl_c_s_dn(CN) -m str docker-proxy-client-execution-worker
      http-request deny unless known_client

      # Exact method-and-path allowlist for Docker calls used by Chronoverse.
      # In particular, NETWORKS does not grant /networks/*/(dis)connect.
      acl read_method method GET HEAD
      acl post_method method POST
      acl delete_method method DELETE
      acl ping_or_version path,url_dec -m reg -i ^(/v[0-9.]+)?/((_ping)|(version))/?$
      acl image_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/images/.+/json/?$
      acl image_create path,url_dec -m reg -i ^(/v[0-9.]+)?/images/create/?$
      acl container_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json/?$
      acl container_logs path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/logs/?$
      acl container_create path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/create/?$
      acl container_start path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/start/?$
      acl container_stop path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/stop/?$
      acl container_wait path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/wait/?$
      acl container_delete path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/?$
      acl network_inspect path,url_dec -m reg -i ^(/v[0-9.]+)?/networks/[a-zA-Z0-9_.-]+/?$
      acl network_create path,url_dec -m reg -i ^(/v[0-9.]+)?/networks/create/?$

      http-request allow if known_client read_method ping_or_version
      http-request allow if image_client read_method image_inspect
      http-request allow if image_client post_method image_create
      http-request allow if execution_client read_method container_inspect
      http-request allow if cleanup_client read_method container_logs
      http-request allow if execution_client post_method container_create
      http-request allow if execution_client post_method container_start
      http-request allow if cleanup_client post_method container_stop
      http-request allow if execution_client post_method container_wait
      http-request allow if cleanup_client delete_method container_delete
      http-request allow if execution_client read_method network_inspect
      http-request allow if execution_client post_method network_create
      http-request deny

      default_backend dockerbackend
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: docker-proxy
  labels:
    app.kubernetes.io/name: docker-proxy
    app.kubernetes.io/component: proxy
    chronoverse.io/client-certs: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: docker-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docker-proxy
        app.kubernetes.io/component: proxy
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: chronoverse.io/docker-workloads
                operator: In
                values: ["true"]
      containers:
      - name: docker-proxy
        image: haproxy:3.4-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
        - |
          test -n "${DOCKER_PROXY_TOKEN}"
          exec haproxy -W -db -f /etc/docker-proxy/haproxy.cfg
        ports:
        - name: docker
          containerPort: 2376
          hostPort: 2376
          protocol: TCP
        env:
        - name: DOCKER_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: docker-proxy-auth
              key: DOCKER_PROXY_TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
        - name: docker-proxy-config
          mountPath: /etc/docker-proxy
          readOnly: true
        - name: docker-proxy-server-certs
          mountPath: /certs/docker-proxy
          readOnly: true
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      - name: runtime-agent
        image: ghcr.io/hitesh22rana/chronoverse/runtime-agent:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: postgres-connection-config
        - secretRef:
            name: postgres-app-secret
        - configMapRef:
            name: observability-config
        - configMapRef:
            name: runtime-agent-config
        env:
        - name: DOCKER_PROXY_TOKEN
          valueFrom:
            secretKeyRef:
              name: docker-proxy-auth
              key: DOCKER_PROXY_TOKEN
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: RUNTIME_AGENT_ID
          value: $(NODE_NAME)
        - name: RUNTIME_AGENT_NODE_NAME
          value: $(NODE_NAME)
        - name: DOCKER_HOST
          value: tcp://127.0.0.1:2376
        - name: RUNTIME_AGENT_DOCKER_HEALTH_ENDPOINT
          value: tcp://127.0.0.1:2376
        - name: RUNTIME_AGENT_DOCKER_ADVERTISE_HOST
          value: $(NODE_IP)
        - name: RUNTIME_AGENT_DOCKER_ADVERTISE_PORT
          value: "2376"
        - name: DOCKER_PROXY_TLS_CA_FILE
          value: /certs/docker-proxy/ca.crt
        - name: DOCKER_PROXY_TLS_CERT_FILE
          value: /certs/docker-proxy/client.crt
        - name: DOCKER_PROXY_TLS_KEY_FILE
          value: /certs/docker-proxy/client.key
        - name: DOCKER_PROXY_TLS_SERVER_NAME
          value: docker-proxy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: docker-proxy-runtime-client-certs
          mountPath: /certs/docker-proxy
          readOnly: true
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-proxy-config
        configMap:
          name: docker-proxy-config
      # The root proxy receives only the server identity. The runtime-agent
      # receives only its client identity, with group-readable files for its
      # non-root UID/GID. Neither container can read the other's private key.
      - name: docker-proxy-server-certs
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: docker-proxy-ca
              items:
              - key: ca.crt
                path: ca.crt
          - secret:
              name: docker-proxy-server
              items:
              - key: server.pem
                path: server.pem
      - name: docker-proxy-runtime-client-certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: docker-proxy-ca
              items:
              - key: ca.crt
                path: ca.crt
          - secret:
              name: docker-proxy-client-runtime-agent
              items:
              - key: tls.crt
                path: client.crt
              - key: tls.key
                path: client.key
      - name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
