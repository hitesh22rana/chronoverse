apiVersion: batch/v1
kind: Job
metadata:
  name: init-certs
  labels:
    app.kubernetes.io/name: init-certs
    app.kubernetes.io/component: init-job
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init-certs
        app.kubernetes.io/component: init-job
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: prepare-certs-volume
        image: alpine:3.22.2
        command: ["sh", "-c", "mkdir -p /certs && chown -R 0:101 /certs && chmod 0775 /certs"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: certs
          mountPath: /certs
      containers:
      - name: init-certs
        image: confluentinc/cp-kafka:7.6.7
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command:
        - sh
        - -ec
        - |
          AUTH_ISSUERS="server users-service workflows-service jobs-service notifications-service analytics-service scheduling-worker workflow-worker execution-worker runtime-agent joblogs-processor analytics-processor outbox-relay"
          mkdir -p /certs/issuers
          for iss in $AUTH_ISSUERS; do
            mkdir -p /certs/issuers/$iss
            if [ ! -f /certs/issuers/$iss/auth.ed ] || [ ! -f /certs/issuers/$iss/auth.ed.pub ]; then
              openssl genpkey -algorithm ED25519 -outform pem -out /certs/issuers/$iss/auth.ed
              openssl pkey -in /certs/issuers/$iss/auth.ed -pubout -out /certs/issuers/$iss/auth.ed.pub
            fi
            chmod 0400 /certs/issuers/$iss/auth.ed
            chmod 0444 /certs/issuers/$iss/auth.ed.pub
          done
          TRUSTED=/certs/issuers/trusted.json
          if [ ! -f "$TRUSTED" ]; then
            printf '{\n' > "$TRUSTED.tmp"
            first=1
            for iss in $AUTH_ISSUERS; do
              kid="$iss:$(date +%Y%m%d)-$(openssl rand -hex 2)"
              if [ $first -eq 0 ]; then printf ',\n' >> "$TRUSTED.tmp"; fi
              first=0
              printf '  \"%s\": {\"iss\": \"%s\", \"pub\": \"%s/auth.ed.pub\"}' "$kid" "$iss" "$iss" >> "$TRUSTED.tmp"
            done
            printf '\n}\n' >> "$TRUSTED.tmp"
            mv "$TRUSTED.tmp" "$TRUSTED"
            chmod 0444 "$TRUSTED"
          fi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: certs
          mountPath: /certs
      volumes:
      - name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-service-certs
  labels:
    app.kubernetes.io/name: init-service-certs
    app.kubernetes.io/component: init-job
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init-service-certs
        app.kubernetes.io/component: init-job
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: prepare-certs-volume
        image: alpine:3.22.2
        command: ["sh", "-c", "mkdir -p /certs && chown -R 0:101 /certs && chmod 0775 /certs"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: certs
          mountPath: /certs
      containers:
      - name: init-service-certs
        image: confluentinc/cp-kafka:7.6.7
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command:
        - sh
        - -ec
        - |
          mkdir -p /certs/ca /certs/clients
          services="postgres redis clickhouse kafka meilisearch users-service workflows-service jobs-service notifications-service analytics-service"
          for svc in $services; do
            mkdir -p "/certs/$svc"
          done
          rm -f /certs/kafka/kafka.p12 \
            /certs/kafka/kafka.keystore.jks \
            /certs/kafka/kafka.truststore.jks \
            /certs/kafka/keystore_creds.txt \
            /certs/kafka/truststore_creds.txt \
            /certs/kafka/key_creds.txt

          if [ ! -f /certs/ca/ca.key ] || [ ! -f /certs/ca/ca.crt ]; then
            openssl genrsa -out /certs/ca/ca.key 4096
            openssl req -x509 -new -nodes -key /certs/ca/ca.key -sha256 -days 365 -out /certs/ca/ca.crt -subj "/CN=Chronoverse Local CA"
          fi

          for svc in $services; do
            cert_path="/certs/$svc"
            if [ -f "$cert_path/$svc.crt" ] && [ -f "$cert_path/$svc.key" ]; then
              if [ "$svc" != postgres ] || openssl x509 -in "$cert_path/$svc.crt" -noout -checkhost postgres-primary >/dev/null 2>&1; then
                continue
              fi
            fi
            openssl genrsa -out "$cert_path/$svc.key" 4096
            openssl req -new -key "$cert_path/$svc.key" -out "$cert_path/$svc.csr" -subj "/CN=$svc"
            if [ "$svc" = postgres ]; then
              printf "subjectAltName=DNS:postgres,DNS:postgres.chronoverse,DNS:postgres.chronoverse.svc,DNS:postgres-primary,DNS:postgres-primary.chronoverse,DNS:postgres-primary.chronoverse.svc,IP:127.0.0.1\n" > "$cert_path/$svc-ext.cnf"
            else
              printf "subjectAltName=DNS:%s,DNS:%s.chronoverse,DNS:%s.chronoverse.svc,IP:127.0.0.1\n" "$svc" "$svc" "$svc" > "$cert_path/$svc-ext.cnf"
            fi
            openssl x509 -req -in "$cert_path/$svc.csr" -CA /certs/ca/ca.crt -CAkey /certs/ca/ca.key -CAcreateserial -out "$cert_path/$svc.crt" -days 365 -extfile "$cert_path/$svc-ext.cnf"
            rm -f "$cert_path/$svc.csr" "$cert_path/$svc-ext.cnf"
          done

          if [ ! -f /certs/clients/client.crt ] || [ ! -f /certs/clients/client.key ]; then
            openssl genrsa -out /certs/clients/client.key 4096
            openssl req -new -key /certs/clients/client.key -out /certs/clients/client.csr -subj "/CN=chronoverse-client"
            echo "subjectAltName=DNS:client" > /certs/clients/client-ext.cnf
            openssl x509 -req -in /certs/clients/client.csr -CA /certs/ca/ca.crt -CAkey /certs/ca/ca.key -CAcreateserial -out /certs/clients/client.crt -days 365 -extfile /certs/clients/client-ext.cnf
            rm -f /certs/clients/client.csr /certs/clients/client-ext.cnf
          fi

          mkdir -p /certs/clickhouse/clients
          cp -f /certs/clients/client.key /certs/clickhouse/clients/client.key
          cp -f /certs/clients/client.crt /certs/clickhouse/clients/client.crt

          openssl pkcs12 -export -in /certs/kafka/kafka.crt -inkey /certs/kafka/kafka.key -certfile /certs/ca/ca.crt -out /certs/kafka/kafka.p12 -name kafka -password "pass:${KAFKA_SSL_KEYSTORE_PASSWORD}"
          keytool -importkeystore -deststorepass "${KAFKA_SSL_KEYSTORE_PASSWORD}" -destkeypass "${KAFKA_SSL_KEYSTORE_PASSWORD}" -destkeystore /certs/kafka/kafka.keystore.jks -srckeystore /certs/kafka/kafka.p12 -srcstoretype PKCS12 -srcstorepass "${KAFKA_SSL_KEYSTORE_PASSWORD}" -alias kafka
          keytool -import -trustcacerts -alias CARoot -file /certs/ca/ca.crt -keystore /certs/kafka/kafka.truststore.jks -storepass "${KAFKA_SSL_TRUSTSTORE_PASSWORD}" -noprompt

          printf "%s\n" "${KAFKA_SSL_KEYSTORE_PASSWORD}" > /certs/kafka/keystore_creds.txt
          printf "%s\n" "${KAFKA_SSL_TRUSTSTORE_PASSWORD}" > /certs/kafka/truststore_creds.txt
          printf "%s\n" "${KAFKA_SSL_KEYSTORE_PASSWORD}" > /certs/kafka/key_creds.txt
          chown -R 0:101 /certs
          chown -R 101:101 /certs/clickhouse
          chown 70:70 /certs/postgres/postgres.key
          chmod -R a+rX /certs
          chmod 0600 /certs/postgres/postgres.key /certs/clients/client.key
          chgrp 101 /certs/clients/client.key
          chmod 0640 /certs/clients/client.key
          chmod 0640 /certs/clickhouse/clickhouse.key /certs/clickhouse/clients/client.key
          chmod 0644 /certs/clickhouse/clickhouse.crt /certs/clickhouse/clients/client.crt
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: certs
          mountPath: /certs
        envFrom:
        - secretRef:
            name: kafka-tls-secret
      volumes:
      - name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-keda-secrets
  labels:
    app.kubernetes.io/name: init-keda-secrets
    app.kubernetes.io/component: init-job
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init-keda-secrets
        app.kubernetes.io/component: init-job
    spec:
      restartPolicy: OnFailure
      serviceAccountName: chronoverse-bootstrap
      securityContext:
        fsGroup: 1001
        supplementalGroups: [101]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-service-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /certs/ca/ca.crt ] && [ -f /certs/clients/client.crt ] && [ -f /certs/clients/client.key ]; do echo waiting for service certificates; sleep 2; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
      containers:
      - name: init-keda-secrets
        # KEDA's Kafka trigger reads TLS material from Kubernetes Secrets.
        # Local workloads use the certificate PVC, so copy only the CA and
        # generic client identity needed by TriggerAuthentication into the
        # placeholders created by setup.sh.
        image: alpine/k8s:1.35.3@sha256:097aa60cbef561146757c7494468e9d7b04d843597ad1a1515ed09d0708c8014
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        - |
          set -eu
          : "${NAMESPACE:?NAMESPACE must be set}"
          sync_secret() {
            local name="$1"; shift
            kubectl --cache-dir=/tmp/kubectl-cache -n "$NAMESPACE" create secret generic "$name" \
              --dry-run=client -o json "$@" | \
              kubectl --cache-dir=/tmp/kubectl-cache -n "$NAMESPACE" patch secret "$name" --type=merge --patch-file=/dev/stdin
          }
          sync_secret chronoverse-ca --from-file=ca.crt=/certs/ca/ca.crt
          sync_secret chronoverse-client-tls \
            --from-file=tls.crt=/certs/clients/client.crt \
            --from-file=tls.key=/certs/clients/client.key
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
      - name: tmp
        emptyDir: {}
