name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  lint:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Validate Docker Compose configurations
        run: make compose/validate

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Run linters
        run: make lint

  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Build code
        run: make build/all

  proto-generated:
    name: Check Generated Protobuf Stubs
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Verify generated protobuf stubs are committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- pkg/proto buf.lock)" ]; then
            echo "Generated protobuf stubs are out of date."
            echo "Run 'make generate' and commit the resulting pkg/proto and buf.lock changes."
            git status --short -- pkg/proto buf.lock
            git diff -- pkg/proto buf.lock
            exit 1
          fi

  test:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      # Run every unit suite with the race detector. Docker-backed integration
      # tests skip under -short and are covered by the dedicated `integration`
      # job below, so this gate stays fast and Docker-independent.
      # COVERPROFILE records application packages and their cross-package calls.
      - name: Run tests
        run: make test/short COVERPROFILE=target/coverage-inputs/unit/coverage.out

      - name: Upload unit coverage profile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-unit
          path: target/coverage-inputs/unit/coverage.out
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration tests (Docker)
    env:
      INTEGRATION_PARALLELISM: "4"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Bound the whole job, including pulls and a possible 20m package timeout.
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Go Environment and Dependencies
        uses: ./.github/actions/setup-go-env

      - name: Pull container images for integration tests
        run: |
          docker pull postgres:18.6-alpine3.24
          docker pull clickhouse/clickhouse-server:26.9.23.15
          docker pull redis:8.10.2-alpine3.23
          docker pull getmeili/meilisearch:v1.55.0
          docker pull confluentinc/cp-kafka:8.3.1
          # Pre-pulled for speed and determinism; DockerWorkflow.Build pulls
          # the image itself when missing. The mq image used by the remote-pull
          # test case is deliberately not pre-pulled.
          docker pull alpine:3.24.2

      # Same -covermode=atomic as the unit job over the same package set, so the
      # two profiles merge instead of one masking the other.
      - name: Run integration tests
        shell: bash
        run: |
          cpus=$(getconf _NPROCESSORS_ONLN)
          echo "::notice title=Integration runner capacity::logical CPUs: $cpus; package parallelism: $INTEGRATION_PARALLELISM"
          started=$SECONDS
          mkdir -p target
          if make test/integration COVERPROFILE=target/coverage-inputs/integration/coverage.out 2>&1 | tee target/integration-tests.log; then
            echo "Integration tests: $((SECONDS - started))s; package parallelism: $INTEGRATION_PARALLELISM." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Integration tests failed after $((SECONDS - started))s; package parallelism: $INTEGRATION_PARALLELISM." >> "$GITHUB_STEP_SUMMARY"
          python - <<'PYTHON'
          import re
          from pathlib import Path

          lines = Path("target/integration-tests.log").read_text(errors="replace").splitlines()
          failures = [i for i, line in enumerate(lines)
                      if re.search(r"--- FAIL:|^FAIL\s|^panic:|^fatal error:|^# ", line)]
          for i in (failures[:20] or [len(lines) - 1]):
              excerpt = "\n".join(lines[max(0, i - 30):i + 7])[-4000:]
              escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Integration test failure::" + escaped)
          PYTHON
          exit 1

      - name: Summarize integration package runtimes
        if: ${{ always() }}
        run: |
          python - <<'PYTHON'
          import html
          import os
          from pathlib import Path
          import re

          log = Path("target/integration-tests.log")
          rows = re.findall(r"^(?:ok|FAIL)\s+(\S+)\s+(\d+(?:\.\d+)?)s(?:\s|$)", log.read_text(errors="replace") if log.exists() else "", re.MULTILINE)
          slowest = sorted(rows, key=lambda row: float(row[1]), reverse=True)[:10]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n### Slowest integration packages\n\nPackage times include test setup and cleanup, but exclude compilation; concurrent durations overlap.\n\n| Package | Elapsed |\n|---|---:|\n")
              for package, seconds in slowest:
                  summary.write("| " + html.escape(package).replace("|", "\\|") + " | " + seconds + "s |\n")
                  message = (package + ": " + seconds + "s").replace("%", "%25")
                  print("::notice title=Integration package timing::" + message)
              if not slowest:
                  summary.write("\nNo completed package timings were available.\n")
          PYTHON

      - name: Upload integration coverage profile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-integration
          path: target/coverage-inputs/integration/coverage.out
          if-no-files-found: error
          retention-days: 14

  dashboard:
    name: Dashboard checks
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Refresh system certificate trust
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          . /etc/os-release
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "20260816ubuntu0.${VERSION_ID}.1"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npx tsc --noEmit

      # test:coverage runs the whole suite through vitest, so this is the
      # existing test gate plus the LCOV report the CRAP job reads. The coverage
      # config names every application source, so a file no test imports is
      # still reported at its real coverage.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload dashboard coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-dashboard
          path: dashboard/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: npm run build

  coverage:
    name: CRAP report
    needs: [test, integration, dashboard]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: crap-report-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"

      # Pinned by revision so the scores are reproducible.
      - name: Install crapper
        run: |
          python -m pip install --upgrade --disable-pip-version-check pip certifi
          python -m pip install --disable-pip-version-check \
            "crapper @ git+https://github.com/unclebob/crapper@9f1bead298b5a9d576bdd6319289fcf426e5b18a"
          python -c "import crapper; print(crapper.__version__)"

      - name: Test the coverage script
        run: python -m unittest discover -s scripts/coverage -t scripts/coverage

      - name: Download unit coverage profile
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-unit
          path: target/coverage-inputs/unit

      - name: Download integration coverage profile
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-integration
          path: target/coverage-inputs/integration

      - name: Download dashboard coverage report
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-dashboard
          path: dashboard/coverage

      # Score tracked application sources using the merged coverage profiles.
      - name: Score complexity against coverage
        run: |
          python scripts/coverage/crap_report.py \
            --go-unit target/coverage-inputs/unit/coverage.out \
            --go-integration target/coverage-inputs/integration/coverage.out \
            --dashboard-lcov dashboard/coverage/lcov.info > /tmp/crap.log
          {
            echo '::group::CRAP report (crap-report.txt is in the crap-report artifact)'
            cat /tmp/crap.log
            echo '::endgroup::'
          }

      - name: Report absolute coverage completion debt
        run: |
          python scripts/coverage/completion_report.py
          cat target/coverage/completion.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record report provenance
        run: python scripts/coverage/ci_report.py prepare

      - name: Find exact base report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/coverage/ci_report.py baseline

      - name: Compare changed functions
        id: comparison
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --unified=0 --no-ext-diff --find-renames "$BASE_SHA" HEAD -- > .metrics/changes.diff
          else
            : > .metrics/changes.diff
          fi
          args=()
          if [ -f .metrics/base-inventory.csv ]; then
            args+=(--base .metrics/base-inventory.csv)
          fi
          reason=$(python -c 'import json; print(json.load(open(".metrics/baseline-status.json"))["reason"])')
          python scripts/coverage/pr_report.py \
            --head .metrics/inventory.csv "${args[@]}" \
            --diff .metrics/changes.diff \
            --summary target/coverage/pr-summary.md \
            --result .metrics/pr-report.json \
            --base-sha "$BASE_SHA" --head-sha "$PR_HEAD_SHA" \
            --tested-sha "$(git rev-parse HEAD)" --baseline-reason "$reason"

      - name: Publish job summary
        id: summary
        if: ${{ always() && steps.comparison.outcome != 'skipped' }}
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          if [ ! -f target/coverage/pr-summary.md ]; then
            echo 'CRAP comparison failed before producing a report. See the job logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat target/coverage/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "[Full report artifact]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$IS_FORK" = true ]; then
            echo 'Fork PR: bot comments are skipped; the summary and artifact remain available.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update PR report comment
        continue-on-error: true
        if: ${{ always() && steps.summary.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/coverage/ci_report.py publish

      - name: Upload CRAP report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: crap-report
          # .metrics is a hidden directory and is skipped without this.
          include-hidden-files: true
          path: |
            .metrics
            target/coverage
          if-no-files-found: error
          retention-days: 90

      - name: Enforce changed-function regressions
        if: ${{ always() && steps.comparison.outcome != 'skipped' }}
        env:
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: test "$COMPARISON_OUTCOME" = success

  static-site:
    name: Static site checks
    env:
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Refresh system certificate trust
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          . /etc/os-release
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge "20260816ubuntu0.${VERSION_ID}.1"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
          cache: npm
          cache-dependency-path: static/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  release-users-service:
    name: Release Users Service
    needs: [lint, build, proto-generated, test, integration]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push users-service Docker image
        run: |
          IMAGE="users-service"
          VERSION_TAG="${{ steps.version.outputs.TAG_NAME }}"
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME_SUFFIX="chronoverse/${IMAGE}"
          IMAGE_FULL_NAME_WITH_TAG="ghcr.io/${OWNER_LOWERCASE}/${IMAGE_NAME_SUFFIX}:${VERSION_TAG}"
          CACHE_SCOPE="buildx-${IMAGE}"

          echo "Checking if image ${IMAGE_FULL_NAME_WITH_TAG} already exists..."
          if docker manifest inspect "${IMAGE_FULL_NAME_WITH_TAG}" > /dev/null 2>&1; then
            echo "Image ${IMAGE_FULL_NAME_WITH_TAG} already exists. Skipping build and push."
          else
            echo "Image ${IMAGE_FULL_NAME_WITH_TAG} does not exist. Building and pushing..."
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg NAME=${IMAGE} \
              --build-arg VERSION=${VERSION_TAG} \
              --build-arg PRIVATE_KEY_PATH=certs/issuers/users-service/auth.ed \
              --build-arg PUBLIC_KEY_PATH=certs/issuers/users-service/auth.ed.pub \
              -t "${IMAGE_FULL_NAME_WITH_TAG}" \
              -t "ghcr.io/${OWNER_LOWERCASE}/${IMAGE_NAME_SUFFIX}:latest" \
              --push \
              --cache-from "type=gha,scope=${CACHE_SCOPE}" \
              --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
              .
          fi

  release-workflows-service:
