apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
      - name: prepare-postgres-tls
        image: alpine:3.22.2
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        - |
          until [ -f /certs/ca/ca.crt ] && [ -f /certs/postgres/postgres.crt ] && [ -f /certs/postgres/postgres.key ]; do
            echo waiting for local postgres certificates
            sleep 2
          done
          cp /certs/ca/ca.crt /postgres-tls/ca.crt
          cp /certs/postgres/postgres.crt /postgres-tls/server.crt
          cp /certs/postgres/postgres.key /postgres-tls/server.key
          chown 70:70 /postgres-tls/ca.crt /postgres-tls/server.crt /postgres-tls/server.key
          chmod 0644 /postgres-tls/ca.crt /postgres-tls/server.crt
          chmod 0600 /postgres-tls/server.key
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: postgres-tls
          mountPath: /postgres-tls
      containers:
      - name: postgres
        image: postgres:18.0-alpine3.22
        imagePullPolicy: IfNotPresent
        args:
        - postgres
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/postgres-tls/server.crt
        - -c
        - ssl_key_file=/postgres-tls/server.key
        - -c
        - ssl_ca_file=/postgres-tls/ca.crt
        ports:
        - name: postgres
          containerPort: 5432
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 1024Mi
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-tls
          mountPath: /postgres-tls
          readOnly: true
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
      - name: postgres-tls
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
