metadata:
  name: lgtm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lgtm
  ports:
  - name: grafana
    port: 3000
    targetPort: grafana
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
