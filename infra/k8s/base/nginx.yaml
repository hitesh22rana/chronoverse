apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      # Rate limiting zones
      limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
      limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
      limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
      limit_req_status 429;
      limit_conn_status 429;

      server {
        listen 80;

        # Request hygiene
        client_max_body_size 1m;
        client_body_timeout 15s;
        client_header_timeout 10s;

        # Auth endpoints are aggressively throttled to brake brute-force and
        # credential-stuffing attempts.
        location = /api/auth/login {
          limit_req zone=auth_zone burst=5 nodelay;
          limit_conn conn_zone 20;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/auth/register {
          limit_req zone=auth_zone burst=5 nodelay;
          limit_conn conn_zone 20;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          limit_req zone=api_zone burst=40 nodelay;
          limit_conn conn_zone 50;

          proxy_pass http://dashboard:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
          limit_req zone=api_zone burst=40 nodelay;
          limit_conn conn_zone 50;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ~ ^/api/workflows/.*/jobs/.*/events$ {
          limit_conn conn_zone 5;

          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass http://server:8080;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/component: ingress
    spec:
      containers:
      - name: nginx
        image: nginx:alpine3.22
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: ingress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx
  ports:
  - name: http
    port: 80
    targetPort: http

