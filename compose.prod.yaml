  nginx:
    image: nginx:alpine3.22
    container_name: nginx
    tmpfs:
      - /etc/nginx/conf.d
    entrypoint: |
      sh -c '
      cat > /etc/nginx/nginx.conf << "EOF"
      events {}

      http {
          # Rate limiting zones
          limit_req_zone $$binary_remote_addr zone=auth_zone:10m rate=10r/m;
          limit_req_zone $$binary_remote_addr zone=api_zone:10m rate=20r/s;
          # Connection zones are separate so each route family enforces its
          # own per-client cap instead of sharing one counter across
          # locations.
          limit_conn_zone $$binary_remote_addr zone=auth_conn_zone:10m;
          limit_conn_zone $$binary_remote_addr zone=api_conn_zone:10m;
          limit_conn_zone $$binary_remote_addr zone=events_conn_zone:10m;
          limit_req_status 429;
          limit_conn_status 429;

          server {
              listen 80;

              # Request hygiene; matches SERVER_REQUEST_BODY_LIMIT (4 MiB)
              client_max_body_size 4m;
              client_body_timeout 15s;
              client_header_timeout 10s;

              # Auth endpoints are aggressively throttled to brake brute-force
              # and credential-stuffing attempts.
              location = /api/auth/login {
                  limit_req zone=auth_zone burst=5 nodelay;
                  limit_conn auth_conn_zone 20;

                  proxy_pass http://server:8080/auth/login;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;

                  proxy_connect_timeout 10s;
                  proxy_read_timeout 60s;
                  proxy_send_timeout 60s;
              }

              location = /api/auth/register {
                  limit_req zone=auth_zone burst=5 nodelay;
                  limit_conn auth_conn_zone 20;

                  proxy_pass http://server:8080/auth/register;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;

                  proxy_connect_timeout 10s;
                  proxy_read_timeout 60s;
                  proxy_send_timeout 60s;
              }

              # Immutable content-hashed build assets are exempt from
              # request-rate limits so a cold page load cannot exhaust the
              # API burst budget.
              location /_next/static/ {
                  limit_conn api_conn_zone 50;

                  proxy_pass http://dashboard:3000;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }

              location / {
                  limit_req zone=api_zone burst=40 nodelay;
                  limit_conn api_conn_zone 50;

                  proxy_pass http://dashboard:3000;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }

              # Special configuration for SSE events endpoint
              location ~ ^/api/workflows/[^/]+/jobs/[^/]+/events$$ {
                  limit_req zone=api_zone burst=40 nodelay;
                  limit_conn events_conn_zone 5;

                  rewrite ^/api/(.*)$$ /$$1 break;
                  proxy_pass http://server:8080;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;

                  # SSE specific settings
                  proxy_buffering off;
                  proxy_cache off;
                  proxy_set_header Connection "";
                  proxy_http_version 1.1;
                  chunked_transfer_encoding off;

                  # Prevent timeouts for long-running connections
                  proxy_read_timeout 24h;
                  proxy_send_timeout 24h;
                  proxy_connect_timeout 60s;
              }

              location /api/ {
                  limit_req zone=api_zone burst=40 nodelay;
                  limit_conn api_conn_zone 50;

                  proxy_pass http://server:8080/;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;

                  # Standard proxy settings with buffering enabled
                  proxy_buffering on;
                  proxy_cache off;

                  # Standard API timeouts
                  proxy_read_timeout 60s;
                  proxy_send_timeout 60s;
                  proxy_connect_timeout 10s;
              }
          }
      }
      EOF
      exec nginx -g "daemon off;"
      '
    ports:
      - "80:80"
    depends_on:
      dashboard:
        condition: service_started
      server:
        condition: service_started
    restart: on-failure
    networks:
      - chronoverse

volumes:
  postgres:
  clickhouse:
  redis:
  meilisearch:
  kafka:
  kafka-secrets:
  lgtm:

networks:
  # Dedicated network for tenant workload containers (VULN-004b). No platform
  # service attaches to it; the runtime pins workloads here and creates it on
  # demand when missing. ICC is disabled so tenants cannot reach each other.
  chronoverse-workloads:
    name: chronoverse-workloads
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  chronoverse:
    name: chronoverse
    driver: bridge
