apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chronoverse

resources:
- ../../base
- infrastructure.yaml
- storage.yaml
- hpa.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: postgres-connection-config
  behavior: merge
  literals:
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_TLS_ENABLED=true
- name: redis-connection-config
  behavior: merge
  literals:
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - REDIS_TLS_ENABLED=true
- name: clickhouse-connection-config
  behavior: merge
  literals:
  - CLICKHOUSE_HOSTS=clickhouse:9440
  - CLICKHOUSE_USERNAME=chronoverse-client
  - CLICKHOUSE_TLS_ENABLED=true
- name: meilisearch-connection-config
  behavior: merge
  literals:
  - MEILISEARCH_URI=https://meilisearch:7700
  - MEILISEARCH_TLS_ENABLED=true
- name: kafka-connection-config
  behavior: merge
  literals:
  - KAFKA_BROKERS=kafka:9094
- name: execution-worker-config
  behavior: merge
  literals:
  - EXECUTION_WORKER_CONCURRENCY=2
- name: server-config
  behavior: merge
  literals:
  - SERVER_HOST_URL=https://chronoverse.example.com
  - SERVER_FRONTEND_URL=https://chronoverse.example.com
  - SERVER_ALLOWED_ORIGINS=https://chronoverse.example.com,

patches:
- path: nginx-realip.yaml
- path: kafka-advertised-listener.yaml
- target:
    kind: ScaledObject
    name: workflow-worker-kafka
  patch: |-
    - op: replace
      path: /spec/minReplicaCount
      value: 2
    - op: replace
      path: /spec/maxReplicaCount
      value: 6
- target:
    kind: ScaledObject
    name: execution-worker-kafka
  patch: |-
    - op: replace
      path: /spec/minReplicaCount
      value: 2
    - op: replace
      path: /spec/maxReplicaCount
      value: 12
- target:
    kind: ScaledObject
    name: joblogs-processor-kafka
  patch: |-
    - op: replace
      path: /spec/minReplicaCount
      value: 2
    - op: replace
      path: /spec/maxReplicaCount
      value: 12
- target:
    kind: ScaledObject
    name: analytics-processor-kafka
  patch: |-
    - op: replace
      path: /spec/minReplicaCount
      value: 2
    - op: replace
      path: /spec/maxReplicaCount
      value: 6
- target:
    kind: Deployment
    labelSelector: chronoverse.io/certs=true
  patch: |-
    - op: add
      path: /spec/template/spec/topologySpreadConstraints
      value:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: chronoverse
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-auth
              items:
              - key: trusted.json
                path: issuers/trusted.json
              - key: server-auth.ed
                path: issuers/server/auth.ed
              - key: server-auth.ed.pub
                path: issuers/server/auth.ed.pub
              - key: users-service-auth.ed
                path: issuers/users-service/auth.ed
              - key: users-service-auth.ed.pub
                path: issuers/users-service/auth.ed.pub
              - key: workflows-service-auth.ed
                path: issuers/workflows-service/auth.ed
              - key: workflows-service-auth.ed.pub
                path: issuers/workflows-service/auth.ed.pub
              - key: jobs-service-auth.ed
                path: issuers/jobs-service/auth.ed
              - key: jobs-service-auth.ed.pub
                path: issuers/jobs-service/auth.ed.pub
              - key: notifications-service-auth.ed
                path: issuers/notifications-service/auth.ed
              - key: notifications-service-auth.ed.pub
                path: issuers/notifications-service/auth.ed.pub
              - key: analytics-service-auth.ed
                path: issuers/analytics-service/auth.ed
              - key: analytics-service-auth.ed.pub
                path: issuers/analytics-service/auth.ed.pub
              - key: scheduling-worker-auth.ed
                path: issuers/scheduling-worker/auth.ed
              - key: scheduling-worker-auth.ed.pub
                path: issuers/scheduling-worker/auth.ed.pub
              - key: workflow-worker-auth.ed
                path: issuers/workflow-worker/auth.ed
              - key: workflow-worker-auth.ed.pub
                path: issuers/workflow-worker/auth.ed.pub
              - key: execution-worker-auth.ed
                path: issuers/execution-worker/auth.ed
              - key: execution-worker-auth.ed.pub
                path: issuers/execution-worker/auth.ed.pub
              - key: runtime-agent-auth.ed
                path: issuers/runtime-agent/auth.ed
              - key: runtime-agent-auth.ed.pub
                path: issuers/runtime-agent/auth.ed.pub
              - key: joblogs-processor-auth.ed
                path: issuers/joblogs-processor/auth.ed
              - key: joblogs-processor-auth.ed.pub
                path: issuers/joblogs-processor/auth.ed.pub
              - key: analytics-processor-auth.ed
                path: issuers/analytics-processor/auth.ed
              - key: analytics-processor-auth.ed.pub
                path: issuers/analytics-processor/auth.ed.pub
              - key: outbox-relay-auth.ed
                path: issuers/outbox-relay/auth.ed
              - key: outbox-relay-auth.ed.pub
                path: issuers/outbox-relay/auth.ed.pub
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
          - secret:
              name: chronoverse-service-tls
              items:
              - key: users-service.crt
                path: users-service/users-service.crt
              - key: users-service.key
                path: users-service/users-service.key
              - key: workflows-service.crt
                path: workflows-service/workflows-service.crt
              - key: workflows-service.key
                path: workflows-service/workflows-service.key
              - key: jobs-service.crt
                path: jobs-service/jobs-service.crt
              - key: jobs-service.key
                path: jobs-service/jobs-service.key
              - key: notifications-service.crt
                path: notifications-service/notifications-service.crt
              - key: notifications-service.key
                path: notifications-service/notifications-service.key
              - key: analytics-service.crt
                path: analytics-service/analytics-service.crt
              - key: analytics-service.key
                path: analytics-service/analytics-service.key
- target:
    kind: Job
    name: database-migration
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-datastores
        # Use the postgres image so we get pg_isready/psql out of the box
        # and can wait for both the TCP port and the chronoverse_app role
        # (the latter is created by init-postgres-app-role, which runs in
        # parallel and is required for the migration connection to succeed).
        image: postgres:18.0-alpine3.22
        command:
        - sh
        - -ec
        - |
          set -eu
          first_clickhouse="${CLICKHOUSE_HOSTS%%,*}"
          clickhouse_host="${first_clickhouse%%:*}"
          clickhouse_port="${first_clickhouse##*:}"
          if [ "$clickhouse_port" = "$first_clickhouse" ]; then clickhouse_port=9440; fi
          export PGSSLMODE=verify-full
          export PGSSLROOTCERT=/certs/ca/ca.crt PGSSLCERT=/certs/clients/client.crt PGSSLKEY=/certs/clients/client.key
          until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres at $POSTGRES_HOST:$POSTGRES_PORT"; sleep 2; done
          # The migration connects as POSTGRES_USER (chronoverse_app), which
          # is provisioned by init-postgres-app-role. Wait until the role
          # exists; psql exits non-zero on a missing role.
          until PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1" >/dev/null 2>&1; do
            echo "waiting for postgres role $POSTGRES_USER"
            sleep 2
          done
          until nc -z "$clickhouse_host" "$clickhouse_port"; do echo "waiting for clickhouse at $clickhouse_host:$clickhouse_port"; sleep 2; done
        env:
        # Migrations must run on the primary directly. golang-migrate's
        # pg_advisory_lock/pg_advisory_unlock rely on a single session, and
        # pgbouncer's transaction pool reassigns backend connections between
        # statements, which would strand the lock and block subsequent runs.
        - name: POSTGRES_HOST
          value: postgres-primary
        - name: POSTGRES_PORT
          value: "5432"
        envFrom:
        - configMapRef:
            name: clickhouse-connection-config
        - secretRef:
            name: postgres-app-secret
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    - op: test
      path: /spec/template/spec/volumes/0/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-auth
              items:
              - key: trusted.json
                path: issuers/trusted.json
              - key: server-auth.ed
                path: issuers/server/auth.ed
              - key: server-auth.ed.pub
                path: issuers/server/auth.ed.pub
              - key: users-service-auth.ed
                path: issuers/users-service/auth.ed
              - key: users-service-auth.ed.pub
                path: issuers/users-service/auth.ed.pub
              - key: workflows-service-auth.ed
                path: issuers/workflows-service/auth.ed
              - key: workflows-service-auth.ed.pub
                path: issuers/workflows-service/auth.ed.pub
              - key: jobs-service-auth.ed
                path: issuers/jobs-service/auth.ed
              - key: jobs-service-auth.ed.pub
                path: issuers/jobs-service/auth.ed.pub
              - key: notifications-service-auth.ed
                path: issuers/notifications-service/auth.ed
              - key: notifications-service-auth.ed.pub
                path: issuers/notifications-service/auth.ed.pub
              - key: analytics-service-auth.ed
                path: issuers/analytics-service/auth.ed
              - key: analytics-service-auth.ed.pub
                path: issuers/analytics-service/auth.ed.pub
              - key: scheduling-worker-auth.ed
                path: issuers/scheduling-worker/auth.ed
              - key: scheduling-worker-auth.ed.pub
                path: issuers/scheduling-worker/auth.ed.pub
              - key: workflow-worker-auth.ed
                path: issuers/workflow-worker/auth.ed
              - key: workflow-worker-auth.ed.pub
                path: issuers/workflow-worker/auth.ed.pub
              - key: execution-worker-auth.ed
                path: issuers/execution-worker/auth.ed
              - key: execution-worker-auth.ed.pub
                path: issuers/execution-worker/auth.ed.pub
              - key: runtime-agent-auth.ed
                path: issuers/runtime-agent/auth.ed
              - key: runtime-agent-auth.ed.pub
                path: issuers/runtime-agent/auth.ed.pub
              - key: joblogs-processor-auth.ed
                path: issuers/joblogs-processor/auth.ed
              - key: joblogs-processor-auth.ed.pub
                path: issuers/joblogs-processor/auth.ed.pub
              - key: analytics-processor-auth.ed
                path: issuers/analytics-processor/auth.ed
              - key: analytics-processor-auth.ed.pub
                path: issuers/analytics-processor/auth.ed.pub
              - key: outbox-relay-auth.ed
                path: issuers/outbox-relay/auth.ed
              - key: outbox-relay-auth.ed.pub
                path: issuers/outbox-relay/auth.ed.pub
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
- target:
    kind: StatefulSet
    name: postgres
  patch: |-
    - op: test
      path: /spec/template/spec/volumes/1/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/1
      value:
        name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-infra-tls
              items:
              - key: postgres.crt
                path: postgres/postgres.crt
              - key: postgres.key
                path: postgres/postgres.key
- target:
    kind: StatefulSet
    name: redis
  patch: |-
    - op: replace
      path: /spec/template/spec/initContainers/0
      value:
        name: prepare-redis-certs
        image: alpine:3.22.2
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        - |
          until [ -f /source-certs/ca/ca.crt ] && [ -f /source-certs/redis/redis.crt ] && [ -f /source-certs/redis/redis.key ] && [ -f /source-certs/clients/client.crt ] && [ -f /source-certs/clients/client.key ]; do
            echo waiting for redis certificates
            sleep 2
          done
          cp -R /source-certs/. /certs/
          chown -R 999:999 /certs
          find /certs -type d -exec chmod 0750 {} \;
          find /certs -type f -exec chmod 0640 {} \;
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "FOWNER"]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: redis-certs-source
          mountPath: /source-certs
          readOnly: true
        - name: certs
          mountPath: /certs
    - op: test
      path: /spec/template/spec/volumes/1/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/1
      value:
        name: redis-certs-source
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
          - secret:
              name: chronoverse-infra-tls
              items:
              - key: redis.crt
                path: redis/redis.crt
              - key: redis.key
                path: redis/redis.key
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: certs
        emptyDir: {}
- target:
    kind: StatefulSet
    name: clickhouse
  patch: |-
    - op: add
      path: /spec/template/spec/securityContext
      value:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
    - op: test
      path: /spec/template/spec/volumes/1/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/1
      value:
        name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clickhouse/clients/client.crt
              - key: tls.key
                path: clickhouse/clients/client.key
          - secret:
              name: chronoverse-infra-tls
              items:
              - key: clickhouse.crt
                path: clickhouse/clickhouse.crt
              - key: clickhouse.key
                path: clickhouse/clickhouse.key
    - op: test
      path: /spec/template/spec/volumes/2/name
      value: clickhouse-certs
    - op: replace
      path: /spec/template/spec/volumes/2
      value:
        name: clickhouse-certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
          - secret:
              name: chronoverse-infra-tls
              items:
              - key: clickhouse.crt
                path: clickhouse.crt
              - key: clickhouse.key
                path: clickhouse.key
    - op: test
      path: /spec/template/spec/volumes/3/name
      value: clickhouse-ca
    - op: replace
      path: /spec/template/spec/volumes/3
      value:
        name: clickhouse-ca
        secret:
          secretName: chronoverse-ca
          items:
          - key: ca.crt
            path: ca.crt
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/1/subPath
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/2/subPath
- target:
    kind: StatefulSet
    name: kafka
  patch: |-
    - op: test
      path: /spec/template/spec/volumes/1/name
      value: kafka-secrets-storage
    - op: replace
      path: /spec/template/spec/volumes/1
      value:
        name: kafka-secrets-storage
        secret:
          secretName: chronoverse-kafka-tls
          defaultMode: 0440
    - op: remove
      path: /spec/template/spec/initContainers/1/volumeMounts/0/subPath
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/1/subPath
- target:
    kind: StatefulSet
    name: meilisearch
  patch: |-
    - op: test
      path: /spec/template/spec/volumes/1/name
      value: certs
    - op: replace
      path: /spec/template/spec/volumes/1
      value:
        name: certs
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: chronoverse-ca
              items:
              - key: ca.crt
                path: ca/ca.crt
          - secret:
              name: chronoverse-client-tls
              items:
              - key: tls.crt
                path: clients/client.crt
              - key: tls.key
                path: clients/client.key
          - secret:
              name: chronoverse-infra-tls
              items:
              - key: meilisearch.crt
                path: meilisearch/meilisearch.crt
              - key: meilisearch.key
                path: meilisearch/meilisearch.key
- target:
    kind: Job
    name: init-kafka-topics
  patch: |-
    # The base init-kafka-topics Job has 6 positional env entries:
    #   /env/0  KAFKA_BOOTSTRAP_SERVER
    #   /env/1  KAFKA_TOPIC_REPLICATION_FACTOR
    #   /env/2  KAFKA_WORKFLOWS_TOPIC_PARTITIONS
    #   /env/3  KAFKA_JOBS_TOPIC_PARTITIONS
    #   /env/4  KAFKA_JOB_LOGS_TOPIC_PARTITIONS
    #   /env/5  KAFKA_ANALYTICS_TOPIC_PARTITIONS
    # Each test op asserts the entry's name so that reordering in the base
    # fails loudly instead of silently misconfiguring partitions.
    - op: test
      path: /spec/template/spec/containers/0/env/2/name
      value: KAFKA_WORKFLOWS_TOPIC_PARTITIONS
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: "6"
    - op: test
      path: /spec/template/spec/containers/0/env/3/name
      value: KAFKA_JOBS_TOPIC_PARTITIONS
    - op: replace
      path: /spec/template/spec/containers/0/env/3/value
      value: "12"
    - op: test
      path: /spec/template/spec/containers/0/env/4/name
      value: KAFKA_JOB_LOGS_TOPIC_PARTITIONS
    - op: replace
      path: /spec/template/spec/containers/0/env/4/value
      value: "12"
    - op: test
      path: /spec/template/spec/containers/0/env/5/name
      value: KAFKA_ANALYTICS_TOPIC_PARTITIONS
    - op: replace
      path: /spec/template/spec/containers/0/env/5/value
      value: "6"
