apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- storage.yaml
- infrastructure.yaml
- cert-bootstrap.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: postgres-secret
  literals:
  - POSTGRES_USER=postgres
  - POSTGRES_PASSWORD=postgres
  - POSTGRES_DB=chronoverse
- name: clickhouse-secret
  literals:
  - CLICKHOUSE_PASSWORD=chronoverse
- name: meilisearch-secret
  literals:
  - MEILISEARCH_MASTER_KEY=35b09c3c7b1001ed1fbed7db29a155d0201ab22d527b41bfba9003da7bb3b404
  - MEILI_MASTER_KEY=35b09c3c7b1001ed1fbed7db29a155d0201ab22d527b41bfba9003da7bb3b404

configMapGenerator:
- name: postgres-connection-config
  behavior: merge
  literals:
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_TLS_ENABLED=false
- name: redis-connection-config
  behavior: merge
  literals:
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - REDIS_TLS_ENABLED=false
- name: clickhouse-connection-config
  behavior: merge
  literals:
  - CLICKHOUSE_HOSTS=clickhouse:9000
  - CLICKHOUSE_USERNAME=default
  - CLICKHOUSE_TLS_ENABLED=false
- name: meilisearch-connection-config
  behavior: merge
  literals:
  - MEILISEARCH_URI=http://meilisearch:7700
  - MEILISEARCH_TLS_ENABLED=false
- name: kafka-connection-config
  behavior: merge
  literals:
  - KAFKA_BROKERS=kafka:9094
- name: server-config
  behavior: merge
  literals:
  - SERVER_HOST_URL=http://localhost
  - SERVER_FRONTEND_URL=http://localhost
  - SERVER_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,

patches:
- target:
    kind: Deployment
    labelSelector: chronoverse.io/certs=true
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /certs/auth.ed ] && [ -f /certs/auth.ed.pub ] && [ -f /certs/ca/ca.crt ] && [ -f /certs/clients/client.crt ]; do echo waiting for local certificates; sleep 2; done"]
        volumeMounts:
        - name: certs
          mountPath: /certs
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
- target:
    kind: Job
    name: database-migration
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /certs/auth.ed ] && [ -f /certs/auth.ed.pub ] && [ -f /certs/ca/ca.crt ] && [ -f /certs/clients/client.crt ]; do echo waiting for local certificates; sleep 2; done"]
        volumeMounts:
        - name: certs
          mountPath: /certs
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: certs
        persistentVolumeClaim:
          claimName: certs-pvc
- target:
    kind: Job
    name: init-kafka-topics
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: wait-for-kafka-certs
        image: alpine:3.22.2
        command: ["sh", "-c", "until [ -f /etc/kafka/secrets/kafka.keystore.jks ] && [ -f /etc/kafka/secrets/kafka.truststore.jks ]; do echo waiting for kafka certificates; sleep 2; done"]
        volumeMounts:
        - name: kafka-client-secrets
          mountPath: /etc/kafka/secrets
          subPath: kafka
          readOnly: true
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: kafka-client-secrets
        persistentVolumeClaim:
          claimName: certs-pvc

