version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Keep this configuration limited to security remediation PRs.
    open-pull-requests-limit: 0
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /dashboard
      - /static
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
