apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chronoverse-default
  labels:
    app.kubernetes.io/name: chronoverse
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  - ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector: {}
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 2375
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 7700
    - protocol: TCP
      port: 9094
    - protocol: TCP
      port: 9440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docker-proxy
  labels:
    app.kubernetes.io/name: docker-proxy
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docker-proxy
  policyTypes:
  - Ingress
  ingress:
  - from:
    # runtime-agent runs as a sidecar in the same DaemonSet pod (self)
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: docker-proxy
    # execution/workflow workers dial the docker endpoint reported by runtime_nodes
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: execution-worker
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: workflow-worker
    ports:
    - protocol: TCP
      port: 2375
